# Local development stack for the backend only. Never used for production
# data (NN-07): production uses managed PostgreSQL and storage.
#
#   cp .env.example .env    # optional; defaults below work without it
#   docker compose up --build
#
# Every port binds to 127.0.0.1 so nothing is exposed to the local network.

name: dakota

services:
  api:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: ${APP_ENV:-development}
      HTTP_ADDR: ":8080"
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      # Inside the Compose network hosts are service names, not localhost.
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      S3_ENDPOINT: minio:9000
      DATABASE_URL: postgres://${POSTGRES_USER:-dakota}:${POSTGRES_PASSWORD:-dakota_dev_only}@db:5432/${POSTGRES_DB:-dakota}?sslmode=disable
    ports:
      - "127.0.0.1:${API_PORT:-8180}:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dakota}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dakota_dev_only}
      POSTGRES_DB: ${POSTGRES_DB:-dakota}
      TZ: Africa/Nairobi
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${DB_PORT:-5442}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  # S3-compatible private storage for uploads (production: Supabase Storage).
  # MinIO stopped publishing official images in 2025; this is Chainguard's
  # build of MinIO from source, pinned by digest (D-20).
  minio:
    image: cgr.dev/chainguard/minio@sha256:d88920d6a50bd0b088223b688be3b76c63e6205dbe494437f67ba1240ea12880
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-dakota_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-dakota_minio_dev_only}
    volumes:
      - minio-data:/data
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"

  # Catches every outgoing email. Web UI on http://localhost:8025.
  mailpit:
    image: axllent/mailpit:v1.31.6
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"

volumes:
  db-data:
  minio-data:
