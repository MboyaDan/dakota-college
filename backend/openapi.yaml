        audience: { type: string, enum: [all, school, cohort, offering] }
        school_id: { type: [string, "null"], format: uuid }
        cohort_id: { type: [string, "null"], format: uuid }
        offering_id: { type: [string, "null"], format: uuid }
        title: { type: string, maxLength: 160 }
        body: { type: string, maxLength: 5000 }
        ends_on: { type: string, description: YYYY-MM-DD, or empty for no end. }
    ServiceRequest:
      type: object
      required: [id, kind, details, status, response, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [letter, transcript, deferment, change_of_course, other] }
        details: { type: string }
        status: { type: string, enum: [open, in_progress, done, declined] }
        response: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    StaffServiceRequest:
      allOf:
        - { $ref: "#/components/schemas/ServiceRequest" }
        - type: object
          required: [student_id, student_number, student_name, handled_by_name]
          properties:
            student_id: { type: string, format: uuid }
            student_number: { type: string }
            student_name: { type: string }
            handled_by_name: { type: [string, "null"] }
    ChangeRequest:
      type: object
      required: [id, old_values, new_values, reason, status, decision, decided_at, created_at]
      properties:
        id: { type: string, format: uuid }
        old_values: { type: object, additionalProperties: { type: string } }
        new_values: { type: object, additionalProperties: { type: string } }
        reason: { type: string }
        status: { type: string, enum: [pending, approved, declined] }
        decision: { type: string }
        decided_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
    StaffChangeRequest:
      allOf:
        - { $ref: "#/components/schemas/ChangeRequest" }
        - type: object
          required: [student_id, student_number, student_name, decided_by_name]
          properties:
            student_id: { type: string, format: uuid }
            student_number: { type: string }
            student_name: { type: string }
            decided_by_name: { type: [string, "null"] }
    StudentProfile:
      type: object
      required: [student_number, first_name, middle_name, last_name, date_of_birth, email, phone, identity_document_type, identity_document,
        status, enrolled_at, programme_title, school_name, intake_name, cohort_name, guardians, change_requests]
      properties:
        student_number: { type: string }
        first_name: { type: string }
        middle_name: { type: string }
        last_name: { type: string }
        date_of_birth: { type: [string, "null"], format: date }
        email: { type: string }
        phone: { type: [string, "null"] }
        identity_document_type: { type: [string, "null"] }
        identity_document: { type: string }
        status: { $ref: "#/components/schemas/StudentStatus" }
        enrolled_at: { type: string, format: date-time }
        programme_title: { type: string }
        school_name: { type: string }
        intake_name: { type: [string, "null"] }
        cohort_name: { type: [string, "null"] }
        guardians: { type: array, items: { $ref: "#/components/schemas/Guardian" } }
        change_requests: { type: array, items: { $ref: "#/components/schemas/ChangeRequest" } }
    StudentTimetableEntry:
      allOf:
        - { $ref: "#/components/schemas/TimetableEntry" }
        - type: object
          required: [offering_id, unit_code, unit_title, term_name]
          properties:
            offering_id: { type: string, format: uuid }
            unit_code: { type: string }
            unit_title: { type: string }
            term_name: { type: string }
    StudentRegistration:
      type: object
      required: [can_register, open, current]
      properties:
        can_register: { type: boolean, description: False unless the student is active. }
        open:
          type: array
          items:
            type: object
            required: [offering_id, term_name, registration_closes_on, unit_code, unit_title, stage, is_core, registered]
            properties:
              offering_id: { type: string, format: uuid }
              term_name: { type: string }
              registration_closes_on: { type: [string, "null"], format: date }
              unit_code: { type: string }
              unit_title: { type: string }
              stage: { type: integer }
              is_core: { type: boolean }
              registered: { type: boolean }
        current: { $ref: "#/components/schemas/Student/properties/registrations" }
    StudentDashboard:
      type: object
      required: [name, student_number, status, programme_title, cohort_name, timetable, notices, open_requests, change_request_pending, registration_open, fee_balance_cents, fee_overdue_cents]
      properties:
        name: { type: string }
        student_number: { type: string }
        status: { $ref: "#/components/schemas/StudentStatus" }
        programme_title: { type: string }
        cohort_name: { type: [string, "null"] }
        timetable: { type: array, items: { $ref: "#/components/schemas/StudentTimetableEntry" } }
        notices: { type: array, items: { $ref: "#/components/schemas/Notice" } }
        open_requests: { type: integer }
        change_request_pending: { type: boolean }
        registration_open: { type: integer, description: Classes open to register for that you have not registered for. }
        fee_balance_cents: { type: [integer, "null"], format: int64, description: "Null while nothing has been billed or paid; positive owes, negative is credit. Pending payments do not count." }
        fee_overdue_cents: { $ref: "#/components/schemas/Cents" }
    AssessmentScheme:
      type: object
      required: [kind, components, pass_mark, grade_bands]
      properties:
        kind: { type: string, enum: [marks, competency] }
        components:
          type: array
          items:
            type: object
            required: [name, weight]
            properties:
              key: { type: string }
              name: { type: string, maxLength: 60 }
              weight: { type: integer, minimum: 0, maximum: 100 }
        pass_mark: { type: integer, minimum: 0, maximum: 100 }
        grade_bands:
          type: array
          items:
            type: object
            required: [grade, min]
            properties:
              grade: { type: string, maxLength: 3 }
              min: { type: integer }
        is_default: { type: boolean }
    ComputedResult:
      type: object
      required: [complete, total, grade, passed, outcome]
      properties:
        complete: { type: boolean }
        total: { type: [integer, "null"] }
        grade: { type: string }
        passed: { type: boolean }
        outcome: { type: [string, "null"], enum: [competent, not_yet_competent, null] }
    ResultSheetItem:
      type: object
      required: [id, offering_id, status, term_name, unit_code, unit_title, students, released_version, updated_at]
      properties:
        id: { type: string, format: uuid }
        offering_id: { type: string, format: uuid }
        status: { type: string, enum: [draft, submitted, approved, released] }
        term_name: { type: string }
        unit_code: { type: string }
        unit_title: { type: string }
        students: { type: integer }
        released_version: { type: integer, description: 0 until first released. }
        updated_at: { type: string, format: date-time }
    ResultSheet:
      type: object
      required: [id, offering_id, status, scheme, unit_code, unit_title, term_name, rows, complete, events, released_version, updated_at]
      properties:
        id: { type: string, format: uuid }
        offering_id: { type: string, format: uuid }
        status: { type: string, enum: [draft, submitted, approved, released] }
        scheme: { $ref: "#/components/schemas/AssessmentScheme" }
        unit_code: { type: string }
        unit_title: { type: string }
        term_name: { type: string }
        rows:
          type: array
          items:
            type: object
            required: [student_id, student_number, name, marks, result]
            properties:
              student_id: { type: string, format: uuid }
              student_number: { type: string }
              name: { type: string }
              marks:
                type: object
                additionalProperties:
                  type: object
                  required: [score, outcome]
                  properties:
                    score: { type: [integer, "null"] }
                    outcome: { type: [string, "null"] }
              result: { $ref: "#/components/schemas/ComputedResult" }
        complete: { type: boolean }
        events:
          type: array
          items:
            type: object
            required: [from, to, reason, at, actor_name]
            properties:
              from: { type: string }
              to: { type: string }
              reason: { type: string }
              at: { type: string, format: date-time }
              actor_name: { type: string }
        released_version: { type: integer }
        updated_at: { type: string, format: date-time }
    StudentResult:
      type: object
      required: [term_name, unit_code, unit_title, released_at, version, total, grade, passed, outcome]
      properties:
        term_name: { type: string }
        unit_code: { type: string }
        unit_title: { type: string }
        released_at: { type: string, format: date-time }
        version: { type: integer }
        total: { type: [integer, "null"] }
        grade: { type: string }
        passed: { type: boolean }
        outcome: { type: [string, "null"], enum: [competent, not_yet_competent, null] }
    Transcript:
      type: object
      required: [id, number, issued_at, issued_by_name]
      properties:
        id: { type: string, format: uuid }
        number: { type: string }
        issued_at: { type: string, format: date-time }
        issued_by_name: { type: string }
    NotificationTemplate:
      type: object
      required: [key, channel, name, description, subject, body, placeholders, max_length, sending, updated_at, updated_by_name]
      properties:
        key: { type: string }
        channel: { type: string, enum: [email, sms, letter], description: "letter: printed (the offer letter); subject is its heading." }
        name: { type: string }
        description: { type: string }
        subject: { type: string }
        body: { type: string }
        placeholders: { type: array, items: { type: string } }
        max_length: { type: integer }
        sending: { type: boolean, description: False for text messages until DG-03 clears. }
        updated_at: { type: string, format: date-time }
        updated_by_name: { type: [string, "null"] }
    SentMessage:
      type: object
      required: [id, name, channel, recipient, status, error, attempts, related_type, related_id, created_at, sent_at, next_attempt_at, can_resend]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, description: The template's name, or the name of a staff-facing email. }
        channel: { type: string, enum: [email, sms] }
        recipient: { type: string }
        status:
          type: string
          enum: [queued, sending, sent, failed, skipped]
          description: "skipped: a text message while no SMS provider is set up (DG-03)."
        error: { type: string, description: The last failure, or why it was skipped. }
        attempts: { type: integer }
        related_type: { type: string, description: "application, enquiry, student, user or empty." }
        related_id: { type: string }
        created_at: { type: string, format: date-time }
        sent_at: { type: [string, "null"], format: date-time }
        next_attempt_at: { type: [string, "null"], format: date-time, description: When a failed attempt is tried again. }
        can_resend: { type: boolean }
    Message:
      type: object
      required: [message]
      properties:
        message: { type: string }
    Created:
      type: object
      required: [id]
      properties:
        id: { type: string, format: uuid }
    AdminUser:
      type: object
      required: [id, email, full_name, status, role_keys, last_login_at, created_at]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        full_name: { type: string }
        status: { type: string, enum: [active, disabled] }
        role_keys: { type: array, items: { type: string } }
        last_login_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
    Role:
      type: object
      required: [id, key, name, description, is_system, permission_keys, user_count]
      properties:
        id: { type: string, format: uuid }
        key: { type: string }
        name: { type: string }
        description: { type: string }
        is_system: { type: boolean }
        permission_keys: { type: array, items: { type: string } }
        user_count: { type: integer }
    Permission:
      type: object
      required: [key, module, description, grantable]
      properties:
        key: { type: string }
        module: { type: string }
        description: { type: string }
        grantable: { type: boolean }
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          const: ok
    CheckStatus:
      type: string
      enum: [ok, unavailable]
    Ready:
      type: object
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [ready, not_ready]
        checks:
          type: object
          required: [database]
          properties:
            database:
              $ref: "#/components/schemas/CheckStatus"
    PublicSite:
      type: object
      required: [generated_at, settings, banners, schools, programmes, faqs, statistics, accreditations, events, news, pages, gallery]
      properties:
        generated_at: { type: string, format: date-time }
        settings:
          type: object
          description: "Visitor-facing settings (contact.*, campus.*, about.*, social.*). Empty values are hidden on the site."
          additionalProperties: { type: string }
        banners: { type: array, items: { $ref: "#/components/schemas/PublicBanner" } }
