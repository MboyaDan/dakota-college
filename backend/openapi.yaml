openapi: 3.1.0
info:
  title: Dakota Training College API
  version: 0.1.0
  description: |
    The contract between the Go API and the Next.js frontend. Frontend types
    are generated from this file (`npm run gen:api` in frontend/).

    The browser calls `/api/*` on the frontend origin; the frontend rewrites
    those requests to this API (D-11).
servers:
  - url: /
tags:
  - name: system
    description: Liveness and readiness probes.
  - name: auth
    description: Sign in, sign out, session and password reset.
  - name: admin
    description: Staff accounts and roles. Every route needs the permission named in its description.
  - name: content
    description: |
      Staff content manager. Content Editors (content.write) create and edit; publishers
      (content.publish, Registrar and Principal) publish. Editing a published item saves a
      pending version that goes live only when published again.
  - name: enquiries
    description: |
      Staff enquiry inbox. enquiries.view to read; enquiries.manage to assign, change status and
      add notes. Every change is audited, and the audit log is the enquiry's history.
  - name: applicant
    description: |
      Applicants sign in without a password: a one-time link is emailed to them, or to the owner
      of an application when its reference number and email match (D-96). Requests for a link
      always answer the same, whether or not anything was sent.
  - name: admissions
    description: |
      Staff admissions workflow over submitted applications (brief 8). admissions.view to read,
      admissions.review to assign, add notes and ask for information, admissions.offer to offer
      or reject, admissions.enrol to enrol. Status changes follow the state machine in
      application_transitions; a change not allowed from the current status answers 409
      not_allowed. Reasons are shown to the applicant; notes are not.
  - name: academics
    description: |
      Student records and academics (Stage 11). students.view and students.update for records;
      academics.manage for units, cohorts, terms, offerings, timetables and registration;
      academics.teach for a trainer's own offerings (AC-08). Without schools.all, records reach
      only the schools you are assigned to; anything outside answers 404.
  - name: student
    description: |
      The student portal. Students sign in with their student number; every other route admits
      student accounts only and reaches the signed-in student's own record (AC-08).
  - name: results
    description: |
      Results (AC-09). Trainers enter and submit marks for their own classes; the Head of School
      approves or returns; the registrar releases. Students see only released results.
  - name: finance
    description: |
      Fees and payments (brief 9, AC-10, AC-11). finance.view to read; finance.invoice for fee
      structures, invoices and billing; finance.payment.record to record payments;
      finance.payment.confirm to confirm or reject them; finance.adjust for adjustments. Money is
      integer cents of KES. Balances are derived from records: issued invoice lines and charges,
      less confirmed payments and credits. Issued invoices, decided payments, receipts and
      adjustments never change. Finance access is college-wide.
  - name: mpesa
    description: |
      M-Pesa C2B on the college paybill (Stage 15a). Only when MPESA_ENABLED; every value comes
      from the environment. Safaricom calls the two public callback routes, which answer only on
      the secret path. Payers use their student number as the account number.
  - name: kcb
    description: |
      KCB Buni instant payment notifications for the college account (Stage 15b). Only when
      KCB_IPN_ENABLED; every value comes from the environment. Until KCB's Signature header can be
      verified, notifications create pending bank payments for Finance to confirm (D-175).
  - name: notifications
    description: |
      Editable text of emails and text messages sent to applicants (notifications.manage), and the
      log of every message the queue sent or tried to send, with resend for failed ones (Stage
      16a). Text messages are kept ready but are not sent until an SMS provider is chosen (DG-03).
  - name: public
    description: |
      Public website. No session. Only published content is returned, and only content whose
      parent is published (a programme of an unpublished school is hidden).
security:
  - session: []
paths:
  /api/v1/health:
    get:
      security: []
      tags: [system]
      operationId: getHealth
      summary: Liveness probe
      description: Returns 200 while the process is serving HTTP. Does not check dependencies.
      responses:
        "200":
          description: The API process is up.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /api/v1/ready:
    get:
      security: []
      tags: [system]
      operationId: getReady
      summary: Readiness probe
      description: Returns 200 when the database is reachable, 503 otherwise. Never includes error detail.
      responses:
        "200":
          description: Ready to serve requests.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ready"
        "503":
          description: A dependency is unavailable.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ready"
  /api/v1/auth/login:
    post:
      security: []
      tags: [auth]
      operationId: login
      summary: Sign in with email and password
      description: |
        Sets the HttpOnly session cookie. Wrong email and wrong password give the
        same answer. Five wrong passwords lock the account for 15 minutes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email, maxLength: 254 }
                password: { type: string }
      responses:
        "200":
          description: Signed in.
          headers:
            Set-Cookie:
              description: Session cookie (HttpOnly, SameSite=Lax, Secure with the __Host- prefix outside local development).
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /api/v1/auth/session:
    get:
      tags: [auth]
      operationId: getSession
      summary: The signed-in user, their permissions and the CSRF token
      responses:
        "200":
          description: Current session.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
  /api/v1/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Sign out (revokes the session)
      security: [{ session: [], csrf: [] }]
      responses:
        "204": { description: Signed out. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
  /api/v1/auth/password-reset:
    post:
      security: []
      tags: [auth]
      operationId: requestPasswordReset
      summary: Email a password reset link
      description: Always answers the same, whether or not the email has an account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email, maxLength: 254 }
      responses:
        "202":
          description: Accepted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
        "400": { $ref: "#/components/responses/BadRequest" }
  /api/v1/auth/password-reset/confirm:
    post:
      security: []
      tags: [auth]
      operationId: confirmPasswordReset
      summary: Set a new password from a reset link
      description: Spends every outstanding link for the user and signs them out everywhere.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token: { type: string, maxLength: 128 }
                password: { type: string, minLength: 12, maxLength: 256 }
      responses:
        "204": { description: Password changed. }
        "400": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/admin/users:
    get:
      tags: [admin]
      operationId: listUsers
      summary: List staff accounts (users.manage)
      responses:
        "200":
          description: Staff accounts.
          content:
            application/json:
              schema:
                type: object
                required: [users]
                properties:
                  users: { type: array, items: { $ref: "#/components/schemas/AdminUser" } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
    post:
      tags: [admin]
      operationId: createUser
      summary: Create a staff account (users.manage)
      description: The person receives an email to set their password. Giving a role that includes system.admin needs system.admin.
      security: [{ session: [], csrf: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, full_name]
              properties:
                email: { type: string, format: email }
                full_name: { type: string, maxLength: 200 }
                role_keys: { type: array, items: { type: string } }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Created" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/admin/users/{id}/roles:
    put:
      tags: [admin]
      operationId: setUserRoles
      summary: Replace a user's roles (users.manage)
      description: Refused if it would leave no active Super Admin, or changes a role with system.admin without holding it.
      security: [{ session: [], csrf: [] }]
      parameters: [{ $ref: "#/components/parameters/ID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role_keys]
              properties:
                role_keys: { type: array, items: { type: string } }
      responses:
        "204": { description: Updated. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/admin/users/{id}/disable:
    post:
      tags: [admin]
      operationId: disableUser
      summary: Disable an account and sign it out everywhere (users.manage)
      security: [{ session: [], csrf: [] }]
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "204": { description: Disabled. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/admin/users/{id}/enable:
    post:
      tags: [admin]
      operationId: enableUser
      summary: Enable an account (users.manage)
      security: [{ session: [], csrf: [] }]
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "204": { description: Enabled. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/admin/roles:
    get:
      tags: [admin]
      operationId: listRoles
      summary: List roles with their permissions (roles.manage)
      responses:
        "200":
          description: Roles.
          content:
            application/json:
              schema:
                type: object
                required: [roles]
                properties:
                  roles: { type: array, items: { $ref: "#/components/schemas/Role" } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
    post:
      tags: [admin]
      operationId: createRole
      summary: Create a role (roles.manage)
      description: system.admin can never be included.
      security: [{ session: [], csrf: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key, name]
              properties:
                key: { type: string, pattern: "^[a-z][a-z_]{1,48}$" }
                name: { type: string, maxLength: 100 }
                description: { type: string, maxLength: 500 }
                permission_keys: { type: array, items: { type: string } }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Created" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/admin/roles/{id}/permissions:
    put:
      tags: [admin]
      operationId: setRolePermissions
      summary: Replace a role's permissions (roles.manage)
      description: The Super Admin role cannot be edited; system.admin can never be added.
      security: [{ session: [], csrf: [] }]
      parameters: [{ $ref: "#/components/parameters/ID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [permission_keys]
              properties:
                permission_keys: { type: array, items: { type: string } }
      responses:
        "204": { description: Updated. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/admin/roles/{id}:
    delete:
      tags: [admin]
      operationId: deleteRole
      summary: Delete a custom role that nobody holds (roles.manage)
      security: [{ session: [], csrf: [] }]
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/admin/permissions:
    get:
      tags: [admin]
      operationId: listPermissions
      summary: List permission keys (roles.manage)
      responses:
        "200":
          description: Permissions.
          content:
            application/json:
              schema:
                type: object
                required: [permissions]
                properties:
                  permissions: { type: array, items: { $ref: "#/components/schemas/Permission" } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
  /api/v1/staff/content/{kind}:
    get:
      tags: [content]
      operationId: listContent
      summary: List items of one content type (content.read)
      parameters: [{ $ref: "#/components/parameters/Kind" }]
      responses:
        "200":
          description: Items, newest or in display order.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/ContentSummary" } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      tags: [content]
      operationId: createContent
      summary: Create a draft (content.write; faq-categories need content.publish)
      security: [{ session: [], csrf: [] }]
      parameters: [{ $ref: "#/components/parameters/Kind" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [document]
              properties:
                document: { $ref: "#/components/schemas/ContentDocument" }
      responses:
        "201":
          description: Created as a draft.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Created" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/staff/content/{kind}/{id}:
    get:
      tags: [content]
      operationId: getContent
      summary: One item with its live and pending versions (content.read)
      parameters: [{ $ref: "#/components/parameters/Kind" }, { $ref: "#/components/parameters/ID" }]
      responses:
        "200":
          description: The item.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContentItem" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    put:
      tags: [content]
      operationId: updateContent
      summary: Save an edit (content.write)
      description: Drafts change in place. A published item gets a pending version instead. base_version must match the item's current version, or 409.
      security: [{ session: [], csrf: [] }]
      parameters: [{ $ref: "#/components/parameters/Kind" }, { $ref: "#/components/parameters/ID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [document, base_version]
              properties:
                document: { $ref: "#/components/schemas/ContentDocument" }
                base_version: { type: string }
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContentItem" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
    delete:
      tags: [content]
      operationId: deleteContent
      summary: Delete a draft that was never published (content.write)
      security: [{ session: [], csrf: [] }]
      parameters: [{ $ref: "#/components/parameters/Kind" }, { $ref: "#/components/parameters/ID" }]
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/staff/content/{kind}/{id}/pending:
    delete:
      tags: [content]
      operationId: discardPendingContent
      summary: Throw away a pending edit (content.write)
      security: [{ session: [], csrf: [] }]
      parameters: [{ $ref: "#/components/parameters/Kind" }, { $ref: "#/components/parameters/ID" }]
      responses:
        "204": { description: Discarded. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/staff/content/{kind}/{id}/publish:
    post:
      tags: [content]
      operationId: publishContent
      summary: Publish the item, applying any pending edit (content.publish)
      description: Refused with 422 and a list of fields when the item is not complete (for example a programme without fees, or a statistic without a verification date).
      security: [{ session: [], csrf: [] }]
      parameters: [{ $ref: "#/components/parameters/Kind" }, { $ref: "#/components/parameters/ID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [base_version]
              properties:
                base_version: { type: string }
      responses:
        "200":
          description: Published.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContentItem" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/staff/content/{kind}/{id}/unpublish:
    post:
      tags: [content]
      operationId: unpublishContent
      summary: Take the item off the site, back to draft (content.publish)
      security: [{ session: [], csrf: [] }]
      parameters: [{ $ref: "#/components/parameters/Kind" }, { $ref: "#/components/parameters/ID" }]
      responses:
        "200":
          description: Now a draft.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContentItem" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/staff/content/{kind}/{id}/archive:
    post:
      tags: [content]
      operationId: archiveContent
      summary: Archive the item (content.publish)
      security: [{ session: [], csrf: [] }]
      parameters: [{ $ref: "#/components/parameters/Kind" }, { $ref: "#/components/parameters/ID" }]
      responses:
        "200":
          description: Archived.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContentItem" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/staff/settings:
    get:
      tags: [content]
      operationId: listSettings
      summary: Site settings (content.read)
      responses:
        "200":
          description: Settings. Empty values are hidden on the site.
          content:
            application/json:
              schema:
                type: object
                required: [settings]
                properties:
                  settings: { type: array, items: { $ref: "#/components/schemas/Setting" } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
    put:
      tags: [content]
      operationId: updateSettings
      summary: Change site settings (content.publish)
      security: [{ session: [], csrf: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [values]
              properties:
                values: { type: object, additionalProperties: { type: string } }
      responses:
        "204": { description: Saved. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/staff/images:
    post:
      tags: [content]
      operationId: uploadImage
      summary: Upload a public website image (content.write)
      description: JPG, PNG or WebP up to 10 MB. Checked by content, rotated upright, metadata removed, stored at widths 480, 960 and 1600 (no wider than the original).
      security: [{ session: [], csrf: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "201":
          description: Stored.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImageFile" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /api/v1/staff/images/{id}:
    get:
      tags: [content]
      operationId: getImage
      summary: An uploaded image's URLs (content.read)
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "200":
          description: The image.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImageFile" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/public/site:
    get:
      security: []
      tags: [public]
      operationId: getPublicSite
      summary: Published content snapshot for the public website
      description: |
        Everything published that the public pages need, in one document, so the website caches
        one response and keeps a bundled copy for when the API is asleep (AC-15). Programmes
        include requirements, upcoming intakes (not closed, not started; Nairobi date) and fees.
        Statistics and accreditations are verified by construction (AC-16). Events: the next 6.
        News: the latest 6, without bodies. Pages: every published text page, with body.
        Gallery: published photos (all have recorded consent). `is_sample` marks dev seed rows.
      responses:
        "200":
          description: The snapshot.
          headers:
            Cache-Control:
              schema: { type: string }
              description: "public, max-age=60"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicSite" }
  /api/v1/public/enquiries:
    post:
      security: []
      tags: [public]
      operationId: createEnquiry
      summary: Send a question from the contact form
      description: |
        Saves the enquiry and emails the office for its query type (admissions and programmes:
        contact.admissions_email; fees: contact.finance_email; others: contact.email, which is
        also the fallback; alumni requests go to contact.email). Replies go to the visitor's email (Reply-To).

        Spam protection (D-70): `website` is a honeypot that must stay empty, and `elapsed_ms`
        (time the form was open) must be at least 3000. Submissions failing either get 202 but are
        neither saved nor emailed. At most 2 links per message; 3 enquiries an hour per email
        address or phone number; 60 an hour overall.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [full_name, query_type, message, elapsed_ms]
              properties:
                full_name: { type: string, maxLength: 120 }
                email: { type: string, description: "Email or phone (or both) is required." }
                phone: { type: string, description: "Digits and spaces, optional leading +." }
                query_type: { type: string, enum: [admissions, programmes, fees, student_life, alumni, other] }
                programme: { type: string, description: "Slug of a published programme, optional." }
                message: { type: string, maxLength: 5000 }
                website: { type: string, description: "Honeypot. Hidden from people; leave empty." }
                elapsed_ms: { type: integer, description: "Milliseconds between showing the form and sending it." }
      responses:
        "202":
          description: Received.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [received] }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /api/v1/public/news:
    get:
      security: []
      tags: [public]
      operationId: listPublicNews
      summary: Published news, newest first, 12 per page
      parameters:
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 1 } }
      responses:
        "200":
          description: One page of articles (without bodies).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NewsList" }
        "400": { $ref: "#/components/responses/BadRequest" }
  /api/v1/public/news/{slug}:
    get:
      security: []
      tags: [public]
      operationId: getPublicNews
      summary: One published article
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The article.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NewsArticle" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/public/events:
    get:
      security: []
      tags: [public]
      operationId: listPublicEvents
      summary: Upcoming published events and the 12 most recent past ones
      responses:
        "200":
          description: Events, without bodies.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventList" }
  /api/v1/public/events/{slug}:
    get:
      security: []
      tags: [public]
      operationId: getPublicEvent
      summary: One published event
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The event.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventDetail" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/staff/enquiries:
    get:
      tags: [enquiries]
      operationId: listEnquiries
      summary: Inbox, newest first, 25 per page (enquiries.view)
      parameters:
        - { name: office, in: query, required: false, schema: { type: string, enum: [admissions, finance, general] }, description: "admissions: admissions and programmes; finance: fees; general: student life, alumni, other." }
        - { name: status, in: query, required: false, schema: { type: string, enum: [new, open, waiting, closed] } }
        - { name: assigned, in: query, required: false, schema: { type: string }, description: "me, none, or a user id." }
        - { name: q, in: query, required: false, schema: { type: string }, description: "Searches name, email, phone and message." }
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 1 } }
      responses:
        "200":
          description: One page of enquiries.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnquiryPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
