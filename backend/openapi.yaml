          items:
            type: object
            required: [registration_id, student_id, student_number, name, cohort_name, status, registered_at]
            properties:
              registration_id: { type: string, format: uuid }
              student_id: { type: string, format: uuid }
              student_number: { type: string }
              name: { type: string }
              cohort_name: { type: [string, "null"] }
              status: { type: string, enum: [registered, dropped] }
              registered_at: { type: string, format: date-time }
    RegisterResult:
      type: object
      required: [registered, already_registered, not_eligible]
      properties:
        registered: { type: integer }
        already_registered: { type: integer }
        not_eligible: { type: integer, description: Not active, unit not in their programme, or outside your schools. }
    Teaching:
      type: object
      required: [offerings, timetable]
      properties:
        offerings:
          type: array
          items:
            type: object
            required: [id, term_name, starts_on, ends_on, unit_code, unit_title, registered]
            properties:
              id: { type: string, format: uuid }
              term_name: { type: string }
              starts_on: { type: string, format: date }
              ends_on: { type: string, format: date }
              unit_code: { type: string }
              unit_title: { type: string }
              registered: { type: integer }
        timetable:
          type: array
          description: Entries of your offerings whose term has not ended.
          items:
            allOf:
              - { $ref: "#/components/schemas/TimetableEntry" }
              - type: object
                required: [offering_id, unit_code, unit_title, term_name]
                properties:
                  offering_id: { type: string, format: uuid }
                  unit_code: { type: string }
                  unit_title: { type: string }
                  term_name: { type: string }
    Notice:
      type: object
      required: [id, audience, audience_name, title, body, ends_on, author_name, created_at]
      properties:
        id: { type: string, format: uuid }
        audience: { type: string, enum: [all, school, cohort, offering] }
        audience_name: { type: string, description: The school, cohort or class; empty for everyone. }
        title: { type: string }
        body: { type: string }
        ends_on: { type: [string, "null"], format: date }
        author_name: { type: string }
        created_at: { type: string, format: date-time }
    StaffNotice:
      allOf:
        - { $ref: "#/components/schemas/Notice" }
        - type: object
          required: [withdrawn, created_by]
          properties:
            withdrawn: { type: boolean }
            created_by: { type: string, format: uuid }
    NoticeInput:
      type: object
      required: [title, body]
