      operationId: listMyApplications
      summary: The signed-in applicant's own applications
      description: Applicant sessions only; any other session gets 403.
      responses:
        "200":
          description: Newest first.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/MyApplication" } }
