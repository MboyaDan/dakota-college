        ends_on: { type: string, format: date }
        registration_opens_on: { type: [string, "null"], format: date }
        registration_closes_on: { type: [string, "null"], format: date }
        is_sample: { type: boolean }
    TermInput:
      type: object
      required: [name, starts_on, ends_on]
      properties:
        name: { type: string, maxLength: 80 }
        starts_on: { type: string, format: date }
        ends_on: { type: string, format: date }
