        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/applicant/applications/{id}/sponsor:
    put:
      tags: [applicant]
      operationId: saveApplicationSponsor
      summary: Save who will pay the fees
      description: Saves while the application is a draft; empty fields are allowed, badly formed ones are not (422). Answers with the whole application. 409 not_editable once submitted or expired.
      security: [{ session: [], csrf: [] }]
      parameters:
        - { $ref: "#/components/parameters/ID" }
      requestBody:
        required: true
        content:
          application/json:
              schema: { $ref: "#/components/schemas/ApplicationSponsor" }
      responses:
        "200":
          description: The application after saving.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApplicationDetail" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/applicant/applications/{id}/documents:
    post:
      tags: [applicant]
      operationId: uploadApplicationDocument
      summary: Upload a document to a draft
      description: |
        PDF, JPG or PNG up to 10 MB, checked by content. Photos are stored re-encoded (upright, no
        metadata, at most 2400 px wide). Scanned for viruses when a scanner is configured
        (422 file_rejected if infected, 503 scan_unavailable if the scanner fails); otherwise
        stored as not_scanned. At most 12 documents. Stored privately (AC-05).
      security: [{ session: [], csrf: [] }]
      parameters:
        - { $ref: "#/components/parameters/ID" }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [kind, file]
              properties:
                kind: { $ref: "#/components/schemas/ApplicationDocument/properties/kind" }
                file: { type: string, format: binary }
      responses:
        "201":
          description: Stored.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApplicationDocument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /api/v1/applicant/applications/{id}/documents/{doc}:
    delete:
      tags: [applicant]
      operationId: removeApplicationDocument
      summary: Remove a document from a draft
      security: [{ session: [], csrf: [] }]
