                      type: object
                      required: [id, full_name]
                      properties:
                        id: { type: string, format: uuid }
                        full_name: { type: string }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
