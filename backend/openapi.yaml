      responses:
        "200":
          description: The link.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FileLink" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/applicant/applications/{id}/submit:
    post:
      tags: [applicant]
      operationId: submitApplication
      summary: Submit the application (once)
      description: |
        Needs the declaration and nothing missing (422 lists what is, as step.field). Send a new
        Idempotency-Key for each submit attempt and the same key when retrying it: a retry gets
        the first answer back with Idempotent-Replayed true. Any other submit of a submitted
        application answers 409 already_submitted; the same key with a different body answers
        422 idempotency_key_reused (AC-04).
      security: [{ session: [], csrf: [] }]
      parameters:
        - { $ref: "#/components/parameters/ID" }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 8, maxLength: 128 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [declaration]
              properties:
                declaration: { type: boolean, description: The answers are true and the applicant agrees to the privacy notice. }
      responses:
        "200":
          description: Submitted (or the stored answer to the same request).
          headers:
            Idempotent-Replayed:
              description: "true when this is the stored answer to an earlier request with the same key."
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                required: [id, reference, status]
                properties:
                  id: { type: string, format: uuid }
                  reference: { type: string }
                  status: { type: string, enum: [submitted] }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/staff/applications/{id}/documents/{doc}/link:
    post:
      tags: [applicant]
      operationId: linkApplicationDocumentForStaff
      summary: A five-minute link to a document of a submitted application (admissions.view)
      description: Drafts answer 404. Every link issued is audited.
      security: [{ session: [], csrf: [] }]
      parameters:
        - { $ref: "#/components/parameters/ID" }
        - { name: doc, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The link.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FileLink" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/files/{token}:
    get:
      tags: [applicant]
      operationId: openFileLink
      summary: The file behind a short-lived link
      description: |
        Works only for the signed-in account the link was issued to, for five minutes. Images are
        shown, PDFs downloaded; responses are never cached and run in a sandbox. Every failure
        answers 404 link_expired.
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The file.
          content:
            application/pdf: { schema: { type: string, format: binary } }
            image/jpeg: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/staff/notification-templates:
    get:
      tags: [notifications]
      operationId: listNotificationTemplates
      summary: Every message template (notifications.manage)
      responses:
        "200":
          description: Templates by key and channel.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/NotificationTemplate" } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
  /api/v1/staff/notification-templates/{key}/{channel}:
    put:
      tags: [notifications]
      operationId: updateNotificationTemplate
      summary: Change a template's text (notifications.manage)
      description: |
        Only the template's own placeholders are allowed; sign-in messages must keep {link}.
        Text messages have no subject and at most 320 characters. Audited.
      security: [{ session: [], csrf: [] }]
      parameters:
        - { name: key, in: path, required: true, schema: { type: string } }
        - { name: channel, in: path, required: true, schema: { type: string, enum: [email, sms] } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                subject: { type: string, maxLength: 150 }
                body: { type: string, maxLength: 5000 }
      responses:
        "204": { description: Saved. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
components:
  securitySchemes:
    csrf:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: The csrf_token from the login or session response. Required on every state-changing request made with a session.
    session:
      type: apiKey
      in: cookie
      name: __Host-dtc_session
      description: Server-side session cookie (dtc_session in local development).
  parameters:
    Kind:
      name: kind
      in: path
      required: true
      schema:
        type: string
        enum: [schools, programmes, news, events, faq-categories, faqs, banners, gallery, statistics, accreditations, pages]
    ID:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    Error:
      description: Error; the code says which.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    BadRequest:
      description: The request body is missing fields or malformed.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthenticated:
      description: No valid session.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  headers:
    RequestID:
      description: Request correlation ID. Echoes a well-formed caller value or is generated.
      schema:
        type: string
  schemas:
    ContentSummary:
      type: object
      required: [id, label, status, is_sample, updated_at, has_pending]
      properties:
        id: { type: string, format: uuid }
        label: { type: string }
        context: { type: string, description: "Parent, e.g. the school of a programme." }
        status: { type: string, enum: [draft, published, archived] }
        is_sample: { type: boolean }
        updated_at: { type: string, format: date-time }
        has_pending: { type: boolean }
    ContentItem:
      type: object
      required: [kind, id, status, published_at, is_sample, updated_at, workflow, live, pending, pending_updated_at, version]
      properties:
        kind: { type: string }
        id: { type: string, format: uuid }
        status: { type: string, enum: [draft, published, archived] }
        published_at: { type: [string, "null"], format: date-time }
        is_sample: { type: boolean }
        updated_at: { type: string, format: date-time }
        workflow: { type: boolean, description: "False for types without draft and publish (faq-categories)." }
        live: { $ref: "#/components/schemas/ContentDocument" }
        pending:
          oneOf:
            - { $ref: "#/components/schemas/ContentDocument" }
            - { type: "null" }
        pending_updated_at: { type: [string, "null"], format: date-time }
        version: { type: string, description: "Send back as base_version when saving or publishing." }
    ContentDocument:
      description: The document for the content type in the path.
      oneOf:
        - { $ref: "#/components/schemas/SchoolDoc" }
        - { $ref: "#/components/schemas/ProgrammeDoc" }
        - { $ref: "#/components/schemas/NewsDoc" }
        - { $ref: "#/components/schemas/EventDoc" }
        - { $ref: "#/components/schemas/FaqCategoryDoc" }
        - { $ref: "#/components/schemas/FaqDoc" }
        - { $ref: "#/components/schemas/BannerDoc" }
        - { $ref: "#/components/schemas/GalleryDoc" }
        - { $ref: "#/components/schemas/StatisticDoc" }
        - { $ref: "#/components/schemas/AccreditationDoc" }
        - { $ref: "#/components/schemas/PageDoc" }
    SchoolDoc:
      type: object
      additionalProperties: false
      required: [slug, name, short_name, accent_key, summary, description, head_message, sort_order]
      properties:
        slug: { type: string }
        name: { type: string }
        short_name: { type: string }
        accent_key: { type: string, enum: [medical, hospitality, ict, business, pool] }
        summary: { type: string }
        description: { type: string }
        head_message: { type: string }
        sort_order: { type: integer }
    ProgrammeDoc:
      type: object
      additionalProperties: false
      required: [school_id, slug, title, level, mode, duration_months, duration_note, min_kcse_grade, summary, overview, what_you_learn, career_outcomes, assessment_model, seo_title, seo_description, sort_order, requirements, intakes, fees]
      properties:
        school_id: { type: string, format: uuid }
        slug: { type: string }
        title: { type: string }
        level: { type: string, enum: [short_course, artisan, certificate, diploma, higher_diploma] }
        mode: { type: string, enum: [full_time, part_time, blended] }
        duration_months: { type: [integer, "null"] }
        duration_note: { type: string }
        min_kcse_grade: { type: [string, "null"], enum: [A, A-, B+, B, B-, C+, C, C-, D+, D, D-, E, null] }
        summary: { type: string }
        overview: { type: string }
        what_you_learn: { type: string }
        career_outcomes: { type: string }
        assessment_model: { type: string, enum: [marks, competency, both] }
        seo_title: { type: string }
        seo_description: { type: string }
        sort_order: { type: integer }
        requirements:
          type: array
          items:
            type: object
            required: [kind, requirement]
            properties:
              kind: { type: string, enum: [academic, document, other] }
              requirement: { type: string }
        intakes:
          type: array
          items:
            type: object
            required: [id, name, starts_on, applications_open_on, application_deadline, capacity, status]
            properties:
              id: { type: [string, "null"], format: uuid, description: "Null for a new intake; keep it for existing ones." }
              name: { type: string }
              starts_on: { type: string, format: date }
              applications_open_on: { type: [string, "null"], format: date }
              application_deadline: { type: [string, "null"], format: date }
              capacity: { type: [integer, "null"] }
              status: { type: string, enum: [planned, open, closed] }
        fees:
          type: array
          items:
            type: object
            required: [label, category, amount_cents, frequency, notes]
            properties:
              label: { type: string }
              category: { type: string, enum: [tuition, registration, assessment, caution, other] }
              amount_cents: { type: integer, description: "Whole cents of KES: KES 1,000.00 is 100000." }
              frequency: { type: string, enum: [once, per_term, per_year, whole_programme] }
              notes: { type: string }
    NewsDoc:
      type: object
      additionalProperties: false
      required: [slug, title, summary, body, cover_file_id, cover_alt, seo_title, seo_description]
      properties:
        slug: { type: string }
        title: { type: string }
        summary: { type: string }
        body: { type: string }
        cover_file_id: { type: [string, "null"], format: uuid }
        cover_alt: { type: string }
        seo_title: { type: string }
        seo_description: { type: string }
    PageDoc:
      type: object
      additionalProperties: false
      required: [slug, title, summary, body, seo_title, seo_description]
      properties:
        slug: { type: string, description: "The page's address, e.g. privacy for /privacy." }
        title: { type: string }
        summary: { type: string }
        body:
          type: string
          description: 'Plain text. Blank lines separate paragraphs; "## " starts a heading; "- " a list item. Never HTML.'
        seo_title: { type: string }
        seo_description: { type: string }
    EventDoc:
      type: object
      additionalProperties: false
      required: [slug, title, summary, body, location, starts_at, ends_at]
      properties:
        slug: { type: string }
        title: { type: string }
        summary: { type: string }
        body: { type: string }
        location: { type: string }
        starts_at: { type: string, format: date-time }
        ends_at: { type: [string, "null"], format: date-time }
    FaqCategoryDoc:
      type: object
      additionalProperties: false
      required: [slug, name, sort_order]
      properties:
        slug: { type: string }
        name: { type: string }
        sort_order: { type: integer }
    FaqDoc:
      type: object
      additionalProperties: false
      required: [category_id, programme_id, question, answer, sort_order]
      properties:
        category_id: { type: string, format: uuid }
        programme_id: { type: [string, "null"], format: uuid }
        question: { type: string }
        answer: { type: string }
        sort_order: { type: integer }
    BannerDoc:
      type: object
      additionalProperties: false
      required: [message, link_label, link_href, starts_at, ends_at]
      properties:
        message: { type: string, maxLength: 200 }
        link_label: { type: [string, "null"] }
        link_href: { type: [string, "null"] }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
    GalleryDoc:
      type: object
      additionalProperties: false
      required: [file_id, caption, alt_text, consent_confirmed, consent_note, sort_order]
      properties:
        file_id: { type: string, format: uuid }
        caption: { type: string }
        alt_text: { type: string }
        consent_confirmed: { type: boolean, description: "Written consent from everyone recognisable. Required to publish." }
        consent_note: { type: string }
        sort_order: { type: integer }
    StatisticDoc:
      type: object
      additionalProperties: false
      required: [label, value, source_note, verified_on, sort_order]
      properties:
        label: { type: string }
        value: { type: string }
        source_note: { type: string, description: "Where the evidence is. Required to publish." }
        verified_on: { type: [string, "null"], format: date, description: "Required to publish; not in the future." }
        sort_order: { type: integer }
    AccreditationDoc:
      type: object
      additionalProperties: false
      required: [body, reference, description, evidence_note, verified_on, sort_order]
      properties:
        body: { type: string }
        reference: { type: string }
        description: { type: string }
        evidence_note: { type: string, description: "Required to publish." }
        verified_on: { type: [string, "null"], format: date, description: "Required to publish." }
        sort_order: { type: integer }
    Setting:
      type: object
      required: [key, value, description, updated_at]
      properties:
        key: { type: string }
        value: { type: string }
        description: { type: string }
        updated_at: { type: string, format: date-time }
    ImageFile:
      type: object
      required: [id, width, height, url, variants]
      properties:
        id: { type: string, format: uuid }
        width: { type: integer }
        height: { type: integer }
        url: { type: string, description: "Largest stored width." }
        variants:
          type: array
          items:
            type: object
            required: [width, url]
            properties:
              width: { type: integer }
              url: { type: string }
    Session:
      type: object
      required: [user, permissions, csrf_token]
      properties:
        user:
          type: object
          required: [id, email, full_name, kind]
          properties:
            id: { type: string, format: uuid }
            email: { type: string }
            full_name: { type: string }
            kind: { type: string, enum: [staff, student, applicant] }
        permissions: { type: array, items: { type: string } }
        csrf_token: { type: string }
        expires_at: { type: string, format: date-time }
    ApplicantSession:
      allOf:
        - { $ref: "#/components/schemas/Session" }
        - type: object
          required: [application_id, next]
          properties:
            application_id:
              type: [string, "null"]
              format: uuid
              description: Set when the link came from a reference number.
            next: { type: string, description: Path to open after signing in; empty for the account page. }
    MyApplication:
      type: object
      required: [id, reference, status, programme_title, programme_slug, intake_name, intake_starts_on, created_at, updated_at, submitted_at]
      properties:
        id: { type: string, format: uuid }
        reference: { type: string }
        status:
          type: string
          enum: [draft, submitted, under_review, info_requested, offered, offer_accepted, enrolled, rejected, withdrawn, expired]
        programme_title: { type: string }
        programme_slug: { type: string }
        intake_name: { type: [string, "null"] }
        intake_starts_on: { type: [string, "null"], format: date }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        submitted_at: { type: [string, "null"], format: date-time }
    StartedApplication:
      type: object
      required: [id, existing]
      properties:
        id: { type: string, format: uuid }
        existing: { type: boolean }
    ApplicationPersonal:
      type: object
      required: [first_name, middle_name, last_name, date_of_birth, identity_document_type, identity_document, nationality, county, phone]
      properties:
        first_name: { type: string, maxLength: 80 }
        middle_name: { type: string, maxLength: 80 }
        last_name: { type: string, maxLength: 80 }
        date_of_birth: { type: string, description: YYYY-MM-DD, or empty. }
        identity_document_type: { type: string, enum: ["", national_id, passport, birth_certificate] }
        identity_document: { type: string, maxLength: 30 }
        nationality: { type: string, maxLength: 60 }
        county: { type: string, description: One of Kenya's 47 counties, "Outside Kenya", or empty. }
        phone: { type: string }
    ApplicationGuardian:
      type: object
      required: [full_name, relationship, phone, email, consent_given]
      properties:
        full_name: { type: string, maxLength: 120 }
        relationship: { type: string, enum: ["", mother, father, guardian, other_relative, other] }
        phone: { type: string }
        email: { type: string }
        consent_given:
          type: boolean
          description: The parent or guardian named here has read the privacy notice and agrees. Recorded as a consent in their name; changing the name needs it again.
    ApplicationEducation:
      type: object
      required: [level, institution, year_completed, qualification, mean_grade, subjects]
      properties:
        level: { type: string, enum: [kcse, kcpe, certificate, diploma, degree, other] }
        institution: { type: string, maxLength: 120 }
        year_completed: { type: [integer, "null"], minimum: 1950 }
        qualification: { type: string, maxLength: 120 }
        mean_grade: { type: string, description: A KCSE grade (A to E) for KCSE; free text otherwise. }
        subjects:
          type: array
          maxItems: 20
          items:
            type: object
            required: [subject, grade]
            properties:
              subject: { type: string, maxLength: 60 }
              grade: { type: string }
    ApplicationSponsor:
      type: object
      required: [type, name, phone]
      properties:
        type: { type: string, enum: ["", self, parent_guardian, sponsor, other] }
        name: { type: string, maxLength: 120 }
        phone: { type: string }
    FileLink:
      type: object
      required: [url, expires_at]
      properties:
        url: { type: string, description: A path on this site, under /api/v1/files/. }
        expires_at: { type: string, format: date-time }
    ApplicationDocument:
      type: object
      required: [id, kind, name, content_type, size_bytes, scan_status, created_at]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [national_id, birth_certificate, passport, kcse_certificate, other_certificate, passport_photo, other] }
        name: { type: string }
        content_type: { type: string, enum: [application/pdf, image/jpeg, image/png] }
        size_bytes: { type: integer }
        scan_status: { type: string, enum: [not_scanned, clean], description: not_scanned when no virus scanner is configured. }
        created_at: { type: string, format: date-time }
    ApplicationDetail:
      type: object
      required: [id, reference, status, editable, programme_title, programme_slug, intake_id, intake_name, intake_starts_on,
        open_intakes, email, personal, needs_guardian, guardian, education, sponsor, documents, required_documents,
        missing, history, draft_expires_at, created_at, updated_at, submitted_at]
      properties:
        id: { type: string, format: uuid }
        reference: { type: string }
        status: { $ref: "#/components/schemas/MyApplication/properties/status" }
        editable: { type: boolean }
        programme_title: { type: string }
        programme_slug: { type: string }
        intake_id: { type: [string, "null"], format: uuid }
        intake_name: { type: [string, "null"] }
        intake_starts_on: { type: [string, "null"], format: date }
        open_intakes:
          type: array
          items:
            type: object
            required: [id, name, starts_on, application_deadline]
            properties:
              id: { type: string, format: uuid }
              name: { type: string }
              starts_on: { type: string, format: date }
              application_deadline: { type: [string, "null"], format: date }
        email: { type: string }
        personal: { $ref: "#/components/schemas/ApplicationPersonal" }
        needs_guardian: { type: boolean, description: True when the date of birth makes the applicant under 18 today. }
        guardian: { $ref: "#/components/schemas/ApplicationGuardian" }
        education: { type: array, items: { $ref: "#/components/schemas/ApplicationEducation" } }
        sponsor: { $ref: "#/components/schemas/ApplicationSponsor" }
        missing:
          type: array
          description: What is still needed before submission, by step.
          items:
            type: object
            required: [step, field, message]
            properties:
              step: { type: string, enum: [choice, personal, guardian, education, sponsor, documents] }
              field: { type: string }
              message: { type: string }
        documents: { type: array, items: { $ref: "#/components/schemas/ApplicationDocument" } }
        required_documents:
          type: array
          description: Document kinds this application needs before it can be submitted.
          items: { $ref: "#/components/schemas/ApplicationDocument/properties/kind" }
        history:
          type: array
          description: Status changes, oldest first.
          items:
            type: object
            required: [status, reason, at]
            properties:
              status: { $ref: "#/components/schemas/MyApplication/properties/status" }
              reason: { type: string }
              at: { type: string, format: date-time }
        draft_expires_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        submitted_at: { type: [string, "null"], format: date-time }
    NotificationTemplate:
      type: object
      required: [key, channel, name, description, subject, body, placeholders, max_length, sending, updated_at, updated_by_name]
      properties:
        key: { type: string }
        channel: { type: string, enum: [email, sms] }
        name: { type: string }
        description: { type: string }
        subject: { type: string }
        body: { type: string }
        placeholders: { type: array, items: { type: string } }
        max_length: { type: integer }
        sending: { type: boolean, description: False for text messages until DG-03 clears. }
        updated_at: { type: string, format: date-time }
        updated_by_name: { type: [string, "null"] }
    Message:
      type: object
      required: [message]
      properties:
        message: { type: string }
    Created:
      type: object
      required: [id]
      properties:
        id: { type: string, format: uuid }
    AdminUser:
      type: object
      required: [id, email, full_name, status, role_keys, last_login_at, created_at]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        full_name: { type: string }
        status: { type: string, enum: [active, disabled] }
        role_keys: { type: array, items: { type: string } }
        last_login_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
    Role:
      type: object
      required: [id, key, name, description, is_system, permission_keys, user_count]
      properties:
        id: { type: string, format: uuid }
        key: { type: string }
        name: { type: string }
        description: { type: string }
        is_system: { type: boolean }
        permission_keys: { type: array, items: { type: string } }
        user_count: { type: integer }
    Permission:
      type: object
      required: [key, module, description, grantable]
      properties:
        key: { type: string }
        module: { type: string }
        description: { type: string }
        grantable: { type: boolean }
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          const: ok
    CheckStatus:
      type: string
      enum: [ok, unavailable]
    Ready:
      type: object
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [ready, not_ready]
        checks:
          type: object
          required: [database]
          properties:
            database:
              $ref: "#/components/schemas/CheckStatus"
    PublicSite:
      type: object
      required: [generated_at, settings, banners, schools, programmes, faqs, statistics, accreditations, events, news, pages, gallery]
      properties:
        generated_at: { type: string, format: date-time }
        settings:
          type: object
          description: "Visitor-facing settings (contact.*, campus.*, about.*, social.*). Empty values are hidden on the site."
          additionalProperties: { type: string }
        banners: { type: array, items: { $ref: "#/components/schemas/PublicBanner" } }
        schools: { type: array, items: { $ref: "#/components/schemas/PublicSchool" } }
        programmes: { type: array, items: { $ref: "#/components/schemas/PublicProgramme" } }
        faqs: { type: array, items: { $ref: "#/components/schemas/PublicFAQ" } }
        statistics: { type: array, items: { $ref: "#/components/schemas/PublicStatistic" } }
        accreditations: { type: array, items: { $ref: "#/components/schemas/PublicAccreditation" } }
        events: { type: array, items: { $ref: "#/components/schemas/PublicEvent" } }
        news: { type: array, items: { $ref: "#/components/schemas/PublicNews" } }
        pages: { type: array, items: { $ref: "#/components/schemas/PublicPage" } }
        gallery: { type: array, items: { $ref: "#/components/schemas/PublicPhoto" } }
    PublicBanner:
      type: object
      required: [message, link_label, link_href, ends_at, is_sample]
      properties:
        message: { type: string }
        link_label: { type: [string, "null"] }
        link_href: { type: [string, "null"] }
        ends_at: { type: string, format: date-time }
        is_sample: { type: boolean }
    PublicSchool:
      type: object
      required: [slug, name, short_name, accent_key, summary, description, head_message, is_sample]
      properties:
        slug: { type: string }
        name: { type: string }
        short_name: { type: string }
        accent_key: { type: string, enum: [medical, hospitality, ict, business, pool] }
        summary: { type: string }
        description: { type: string }
        head_message: { type: string }
        is_sample: { type: boolean }
    PublicProgramme:
      type: object
      required: [slug, title, school_slug, level, mode, duration_months, duration_note, min_kcse_grade, summary, overview, what_you_learn, career_outcomes, seo_title, seo_description, requirements, intakes, fees, published_at, updated_at, is_sample]
      properties:
        slug: { type: string }
        title: { type: string }
        school_slug: { type: string }
        level: { type: string, enum: [short_course, artisan, certificate, diploma, higher_diploma] }
        mode: { type: string, enum: [full_time, part_time, blended] }
        duration_months: { type: [integer, "null"] }
        duration_note: { type: string }
        min_kcse_grade: { type: [string, "null"], enum: [A, A-, B+, B, B-, C+, C, C-, D+, D, D-, E, null] }
        summary: { type: string }
        overview: { type: string }
        what_you_learn: { type: string }
        career_outcomes: { type: string }
        seo_title: { type: string }
        seo_description: { type: string }
        requirements:
          type: array
          items:
            type: object
            required: [kind, requirement]
            properties:
              kind: { type: string, enum: [academic, document, other] }
              requirement: { type: string }
        intakes:
          type: array
          items:
            type: object
            required: [id, name, starts_on, applications_open_on, application_deadline, status]
            properties:
              id: { type: string, format: uuid }
              name: { type: string }
              starts_on: { type: string, format: date }
              applications_open_on: { type: [string, "null"], format: date }
              application_deadline: { type: [string, "null"], format: date }
              status: { type: string, enum: [planned, open] }
        fees:
          type: array
          items:
            type: object
            required: [intake_id, label, category, amount_cents, frequency, notes]
            properties:
              intake_id: { type: [string, "null"], format: uuid, description: "Set when the line applies to one intake only." }
              label: { type: string }
              category: { type: string, enum: [tuition, registration, assessment, caution, other] }
              amount_cents: { type: integer, description: "Whole cents of KES: KES 1,000.00 is 100000." }
              frequency: { type: string, enum: [once, per_term, per_year, whole_programme] }
              notes: { type: string }
        published_at: { type: [string, "null"], format: date-time }
        updated_at: { type: string, format: date-time }
        is_sample: { type: boolean }
    PublicFAQ:
      type: object
      required: [category_slug, category_name, programme_slug, question, answer, is_sample]
      properties:
        category_slug: { type: string }
        category_name: { type: string }
        programme_slug: { type: [string, "null"], description: "Set for questions about one programme." }
        question: { type: string }
        answer: { type: string }
        is_sample: { type: boolean }
    PublicStatistic:
      type: object
      required: [label, value, verified_on, is_sample]
      properties:
        label: { type: string }
        value: { type: string }
        verified_on: { type: string, format: date }
        is_sample: { type: boolean }
    PublicAccreditation:
      type: object
      required: [body, reference, description, verified_on, is_sample]
      properties:
        body: { type: string }
        reference: { type: string }
        description: { type: string }
        verified_on: { type: string, format: date }
        is_sample: { type: boolean }
    PublicEvent:
      type: object
      required: [slug, title, summary, location, starts_at, ends_at, is_sample]
      properties:
        slug: { type: string }
        title: { type: string }
        summary: { type: string }
        location: { type: string }
        starts_at: { type: string, format: date-time }
        ends_at: { type: [string, "null"], format: date-time }
        is_sample: { type: boolean }
    PublicNews:
      type: object
      required: [slug, title, summary, published_at, cover, cover_alt, is_sample]
      properties:
        slug: { type: string }
        title: { type: string }
        summary: { type: string }
        published_at: { type: [string, "null"], format: date-time }
        cover:
          oneOf:
            - $ref: "#/components/schemas/ImageFile"
            - type: "null"
        cover_alt: { type: string }
        is_sample: { type: boolean }
    PublicPage:
      type: object
      required: [slug, title, summary, body, seo_title, seo_description, published_at, updated_at, is_sample]
      properties:
        slug: { type: string }
        title: { type: string }
        summary: { type: string }
        body: { type: string, description: 'Plain text with "## " headings and "- " list items.' }
        seo_title: { type: string }
        seo_description: { type: string }
        published_at: { type: [string, "null"], format: date-time }
        updated_at: { type: string, format: date-time }
        is_sample: { type: boolean }
    PublicPhoto:
      type: object
      required: [image, caption, alt_text, is_sample]
      properties:
        image: { $ref: "#/components/schemas/ImageFile" }
        caption: { type: string }
        alt_text: { type: string }
        is_sample: { type: boolean }
    NewsList:
      type: object
      required: [items, page, total_pages, total]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/PublicNews" } }
        page: { type: integer }
        total_pages: { type: integer }
        total: { type: integer }
    NewsArticle:
      allOf:
        - { $ref: "#/components/schemas/PublicNews" }
        - type: object
          required: [body, seo_title, seo_description, updated_at]
          properties:
            body: { type: string }
            seo_title: { type: string }
            seo_description: { type: string }
            updated_at: { type: string, format: date-time }
    EventList:
      type: object
      required: [upcoming, past]
      properties:
        upcoming: { type: array, items: { $ref: "#/components/schemas/PublicEvent" } }
        past: { type: array, items: { $ref: "#/components/schemas/PublicEvent" }, description: "The 12 most recent." }
    EventDetail:
      allOf:
        - { $ref: "#/components/schemas/PublicEvent" }
        - type: object
          required: [body, published_at, updated_at]
          properties:
            body: { type: string }
            published_at: { type: [string, "null"], format: date-time }
            updated_at: { type: string, format: date-time }
    EnquiryItem:
      type: object
      required: [id, full_name, email, phone, query_type, office, programme_title, status, assigned_to, assignee_name, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        full_name: { type: string }
        email: { type: [string, "null"] }
        phone: { type: [string, "null"] }
        query_type: { type: string, enum: [admissions, programmes, fees, student_life, alumni, other] }
        office: { type: string, enum: [admissions, finance, general] }
        programme_title: { type: [string, "null"] }
        status: { type: string, enum: [new, open, waiting, closed] }
        assigned_to: { type: [string, "null"], format: uuid }
        assignee_name: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    EnquiryPage:
      type: object
      required: [items, page, total_pages, total]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/EnquiryItem" } }
        page: { type: integer }
        total_pages: { type: integer }
        total: { type: integer }
    EnquiryDetail:
      allOf:
        - { $ref: "#/components/schemas/EnquiryItem" }
        - type: object
          required: [message, source, programme_slug, closed_at, notes, history]
          properties:
            message: { type: string }
            source: { type: string }
            programme_slug: { type: [string, "null"] }
            closed_at: { type: [string, "null"], format: date-time }
            notes:
              type: array
              items:
                type: object
                required: [id, body, author_name, created_at]
                properties:
                  id: { type: string, format: uuid }
                  body: { type: string }
                  author_name: { type: string }
                  created_at: { type: string, format: date-time }
            history:
              type: array
              description: From the audit log, oldest first.
              items:
                type: object
                required: [at, action, actor_name, details]
                properties:
                  at: { type: string, format: date-time }
                  action: { type: string, enum: [enquiry.assigned, enquiry.status_changed, enquiry.note_added] }
                  actor_name: { type: [string, "null"] }
                  details: { type: object, additionalProperties: true }
    Error:
      description: Error body returned by every endpoint on failure.
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Stable machine-readable code, e.g. not_found.
            message:
              type: string
              description: Plain-language message safe to show to users.
            request_id:
              type: string
            fields:
              type: array
              description: For validation_failed, what to fix in each field.
              items:
                type: object
                required: [field, message]
                properties:
                  field: { type: string }
                  message: { type: string }
