        - { name: status, in: query, required: false, schema: { type: string, enum: [new, open, waiting, closed] } }
        - { name: assigned, in: query, required: false, schema: { type: string }, description: "me, none, or a user id." }
        - { name: q, in: query, required: false, schema: { type: string }, description: "Searches name, email, phone and message." }
