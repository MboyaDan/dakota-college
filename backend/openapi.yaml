  /api/v1/applicant/sign-in-link:
    post:
      security: []
      tags: [applicant]
      operationId: requestApplicantSignInLink
      summary: Email a one-time link to start or continue an application
      description: |
        Sent only to a new email address or an active applicant account; staff and student
        accounts get nothing. The link works once, for 30 minutes. Rate limited per address and
        per IP; a limited request gets the same answer.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email, maxLength: 254 }
                full_name: { type: string, maxLength: 120, description: Used only when the link creates the account. }
                next:
                  type: string
                  maxLength: 300
                  description: Where to go after signing in. Kept only if it is a plain path under /apply/.
      responses:
        "202":
          description: Accepted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/applicant/resume:
    post:
      security: []
      tags: [applicant]
      operationId: resumeApplicationByReference
      summary: Email a sign-in link to the owner of an application
      description: Sent only when the reference exists and the email is the one on the application.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reference, email]
              properties:
                reference: { type: string, maxLength: 40, examples: [DTC-APP-2026-000123] }
                email: { type: string, format: email, maxLength: 254 }
      responses:
        "202":
          description: Accepted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/applicant/sign-in:
    post:
      security: []
      tags: [applicant]
      operationId: applicantSignIn
      summary: Spend a sign-in link and start a session
      description: |
        Creates the applicant account on first use. Spends every outstanding link for the
        address. 400 invalid_sign_in_link if the link is unknown, used or expired.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string, maxLength: 128 }
      responses:
        "200":
          description: Signed in.
          headers:
            Set-Cookie:
              description: Session cookie, as for staff sign-in.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApplicantSession" }
        "400": { $ref: "#/components/responses/Error" }
  /api/v1/applicant/applications:
    get:
      tags: [applicant]
      operationId: listMyApplications
      summary: The signed-in applicant's own applications
      description: Applicant sessions only; any other session gets 403.
      responses:
        "200":
          description: Newest first.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/MyApplication" } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
    post:
      tags: [applicant]
      operationId: startApplication
      summary: Start an application for a programme and intake
      description: |
        The programme must be published and the intake open (with one open intake it may be left
        out). Gives the draft a reference number (DTC-APP-YYYY-NNNNNN) and emails it. Starting
        the same programme and intake again answers 200 with the existing application.
        409 applications_closed when no intake is open.
      security: [{ session: [], csrf: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [programme]
              properties:
                programme: { type: string, description: Programme slug. }
                intake_id: { type: [string, "null"], format: uuid }
      responses:
        "200":
          description: An application for this programme and intake already existed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StartedApplication" }
        "201":
          description: Started.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StartedApplication" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/applicant/applications/{id}:
    get:
      tags: [applicant]
      operationId: getMyApplication
      summary: One of the applicant's own applications, with what is still missing
