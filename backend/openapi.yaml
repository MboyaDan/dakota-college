        - { name: status, in: query, required: false, schema: { type: string, enum: [submitted, under_review, info_requested, offered, offer_accepted, enrolled, rejected, withdrawn, expired] } }
        - { name: programme, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: intake, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: assigned, in: query, required: false, schema: { type: string }, description: "me, none, or a user id." }
        - { name: q, in: query, required: false, schema: { type: string }, description: "Searches reference, name, email and phone." }
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 1 } }
