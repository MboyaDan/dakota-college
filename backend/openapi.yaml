        id: { type: string, format: uuid }
        kind: { type: string, enum: [class, exam] }
        weekday: { type: [integer, "null"], minimum: 1, maximum: 7, description: 1 is Monday. }
        on_date: { type: [string, "null"], format: date }
        starts_at: { type: string, description: HH:MM }
        ends_at: { type: string, description: HH:MM }
        room: { type: string }
    TimetableInput:
      type: object
      required: [kind, starts_at, ends_at]
      properties:
        kind: { type: string, enum: [class, exam] }
        weekday: { type: [integer, "null"], minimum: 1, maximum: 7 }
        on_date: { type: string, description: YYYY-MM-DD, for exams. }
        starts_at: { type: string, description: HH:MM }
        ends_at: { type: string, description: HH:MM }
        room: { type: string, maxLength: 60 }
    Offering:
      type: object
      required: [id, term_id, term_name, starts_on, ends_on, unit_id, unit_code, unit_title, trainers, timetable, class_list]
      properties:
        id: { type: string, format: uuid }
        term_id: { type: string, format: uuid }
        term_name: { type: string }
        starts_on: { type: string, format: date }
        ends_on: { type: string, format: date }
        unit_id: { type: string, format: uuid }
        unit_code: { type: string }
        unit_title: { type: string }
        trainers: { type: array, items: { $ref: "#/components/schemas/Person" } }
        timetable: { type: array, items: { $ref: "#/components/schemas/TimetableEntry" } }
