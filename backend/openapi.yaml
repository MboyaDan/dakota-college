    post:
      security: []
      tags: [applicant]
      operationId: applicantSignIn
      summary: Spend a sign-in link and start a session
      description: |
        Creates the applicant account on first use. Spends every outstanding link for the
        address. 400 invalid_sign_in_link if the link is unknown, used or expired.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string, maxLength: 128 }
