        "200":
          description: The link.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FileLink" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/applicant/applications/{id}/submit:
    post:
      tags: [applicant]
      operationId: submitApplication
      summary: Submit the application (once)
      description: |
        Needs the declaration and nothing missing (422 lists what is, as step.field). Send a new
        Idempotency-Key for each submit attempt and the same key when retrying it: a retry gets
        the first answer back with Idempotent-Replayed true. Any other submit of a submitted
        application answers 409 already_submitted; the same key with a different body answers
        422 idempotency_key_reused (AC-04).
      security: [{ session: [], csrf: [] }]
      parameters:
        - { $ref: "#/components/parameters/ID" }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 8, maxLength: 128 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [declaration]
              properties:
                declaration: { type: boolean, description: The answers are true and the applicant agrees to the privacy notice. }
      responses:
        "200":
          description: Submitted (or the stored answer to the same request).
          headers:
            Idempotent-Replayed:
              description: "true when this is the stored answer to an earlier request with the same key."
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                required: [id, reference, status]
                properties:
                  id: { type: string, format: uuid }
                  reference: { type: string }
                  status: { type: string, enum: [submitted] }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
