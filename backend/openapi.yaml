    post:
      security: []
      tags: [applicant]
      operationId: resumeApplicationByReference
      summary: Email a sign-in link to the owner of an application
      description: Sent only when the reference exists and the email is the one on the application.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reference, email]
              properties:
                reference: { type: string, maxLength: 40, examples: [DTC-APP-2026-000123] }
                email: { type: string, format: email, maxLength: 254 }
      responses:
        "202":
          description: Accepted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "422": { $ref: "#/components/responses/Error" }
