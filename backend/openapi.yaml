  /api/v1/payments/kcb/{secret}/notification:
    post:
      tags: [kcb]
      operationId: kcbNotification
      summary: KCB Buni instant payment notification (public; answered only on the secret path)
      description: |
        Stored as received with its Signature header, then recorded once per transactionReference.
        Until the signature can be verified (D-175), a match becomes a pending bank payment for
        Finance to confirm. statusCode 1 means it was stored but could not be read. 404 for any
        other secret or address; 429 after repeated refusals.
      security: []
      parameters:
        - { name: secret, in: path, required: true, schema: { type: string } }
        - { name: Signature, in: header, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "200":
          description: Acknowledged.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KcbAnswer" }
        "404": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
