      responses:
        "200":
          description: One page of articles (without bodies).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NewsList" }
        "400": { $ref: "#/components/responses/BadRequest" }
  /api/v1/public/news/{slug}:
    get:
      security: []
