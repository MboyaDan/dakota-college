      security: [{ session: [], csrf: [] }]
      parameters:
        - { $ref: "#/components/parameters/ID" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [student_id, note], properties: { student_id: { type: string, format: uuid }, note: { type: string, minLength: 5, maxLength: 1000 } } }
