        received_cents: { $ref: "#/components/schemas/Cents" }
        credited_cents: { $ref: "#/components/schemas/Cents" }
        unmatched_cents: { $ref: "#/components/schemas/Cents" }
        manual_count: { type: integer, description: M-Pesa payments recorded by hand for the day that Safaricom has not reported. }
        manual_cents: { $ref: "#/components/schemas/Cents" }
        manual_pending: { type: integer }
