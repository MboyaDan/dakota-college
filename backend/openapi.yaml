  /api/v1/applicant/sign-in-link:
    post:
      security: []
      tags: [applicant]
      operationId: requestApplicantSignInLink
      summary: Email a one-time link to start or continue an application
      description: |
        Sent only to a new email address or an active applicant account; staff and student
        accounts get nothing. The link works once, for 30 minutes. Rate limited per address and
        per IP; a limited request gets the same answer.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email, maxLength: 254 }
                full_name: { type: string, maxLength: 120, description: Used only when the link creates the account. }
                next:
                  type: string
                  maxLength: 300
                  description: Where to go after signing in. Kept only if it is a plain path under /apply/.
      responses:
        "202":
          description: Accepted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "422": { $ref: "#/components/responses/Error" }
