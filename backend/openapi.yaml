        "403": { $ref: "#/components/responses/Error" }
  /api/v1/staff/notification-templates:
    get:
      tags: [notifications]
      operationId: listNotificationTemplates
      summary: Every message template (notifications.manage)
      responses:
        "200":
          description: Templates by key and channel.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/NotificationTemplate" } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
  /api/v1/staff/notification-templates/{key}/{channel}:
    put:
      tags: [notifications]
      operationId: updateNotificationTemplate
      summary: Change a template's text (notifications.manage)
      description: |
        Only the template's own placeholders are allowed; sign-in messages must keep {link}.
        Text messages have no subject and at most 320 characters. Audited.
      security: [{ session: [], csrf: [] }]
      parameters:
        - { name: key, in: path, required: true, schema: { type: string } }
        - { name: channel, in: path, required: true, schema: { type: string, enum: [email, sms, letter] } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                subject: { type: string, maxLength: 150 }
                body: { type: string, maxLength: 5000 }
      responses:
        "204": { description: Saved. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/staff/notifications:
    get:
      tags: [notifications]
      operationId: listSentMessages
      summary: Messages sent or waiting to be sent, newest first, 50 a page (notifications.manage)
      description: The message text is never returned.
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [queued, sending, sent, failed, skipped] } }
        - { name: channel, in: query, schema: { type: string, enum: [email, sms] } }
        - { name: q, in: query, description: Part of the recipient's address or number., schema: { type: string, maxLength: 80 } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, maximum: 10000 } }
      responses:
        "200":
          description: One page of the log.
          content:
            application/json:
              schema:
                type: object
                required: [items, total, page, page_size]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/SentMessage" } }
                  total: { type: integer }
                  page: { type: integer }
                  page_size: { type: integer }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
  /api/v1/staff/notifications/counts:
    get:
      tags: [notifications]
      operationId: sentMessageCounts
      summary: Messages waiting, and messages that failed in the last seven days (notifications.manage)
      responses:
        "200":
          description: Counts for the staff overview.
          content:
            application/json:
              schema:
                type: object
                required: [waiting, failed_recent]
                properties:
                  waiting: { type: integer }
                  failed_recent: { type: integer }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
  /api/v1/staff/notifications/{id}/resend:
    post:
      tags: [notifications]
      operationId: resendMessage
      summary: Send a failed message again (notifications.manage)
      description: |
        Starts a fresh set of attempts. Only for failed messages whose text is still kept: a
        message's text is erased when it expires, and messages with a sign-in or reset link
        expire with the link. Audited.
      security: [{ session: [], csrf: [] }]
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "204": { description: Queued again. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
components:
  securitySchemes:
    csrf:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: The csrf_token from the login or session response. Required on every state-changing request made with a session.
    session:
      type: apiKey
      in: cookie
      name: __Host-dtc_session
      description: Server-side session cookie (dtc_session in local development).
  parameters:
    Kind:
      name: kind
      in: path
      required: true
      schema:
        type: string
        enum: [schools, programmes, news, events, faq-categories, faqs, banners, gallery, statistics, accreditations, pages]
    ID:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: A new key for each action the user takes, and the same key when retrying it (NN-04).
      schema: { type: string, minLength: 8, maxLength: 128 }
  responses:
    Error:
      description: Error; the code says which.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    BadRequest:
      description: The request body is missing fields or malformed.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthenticated:
      description: No valid session.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  headers:
    RequestID:
      description: Request correlation ID. Echoes a well-formed caller value or is generated.
      schema:
        type: string
  schemas:
    ContentSummary:
      type: object
      required: [id, label, status, is_sample, updated_at, has_pending]
      properties:
        id: { type: string, format: uuid }
        label: { type: string }
        context: { type: string, description: "Parent, e.g. the school of a programme." }
        status: { type: string, enum: [draft, published, archived] }
        is_sample: { type: boolean }
        updated_at: { type: string, format: date-time }
        has_pending: { type: boolean }
    ContentItem:
      type: object
      required: [kind, id, status, published_at, is_sample, updated_at, workflow, live, pending, pending_updated_at, version]
      properties:
        kind: { type: string }
        id: { type: string, format: uuid }
        status: { type: string, enum: [draft, published, archived] }
        published_at: { type: [string, "null"], format: date-time }
        is_sample: { type: boolean }
        updated_at: { type: string, format: date-time }
        workflow: { type: boolean, description: "False for types without draft and publish (faq-categories)." }
        live: { $ref: "#/components/schemas/ContentDocument" }
        pending:
          oneOf:
            - { $ref: "#/components/schemas/ContentDocument" }
            - { type: "null" }
        pending_updated_at: { type: [string, "null"], format: date-time }
        version: { type: string, description: "Send back as base_version when saving or publishing." }
    ContentDocument:
      description: The document for the content type in the path.
      oneOf:
        - { $ref: "#/components/schemas/SchoolDoc" }
        - { $ref: "#/components/schemas/ProgrammeDoc" }
        - { $ref: "#/components/schemas/NewsDoc" }
        - { $ref: "#/components/schemas/EventDoc" }
        - { $ref: "#/components/schemas/FaqCategoryDoc" }
        - { $ref: "#/components/schemas/FaqDoc" }
        - { $ref: "#/components/schemas/BannerDoc" }
        - { $ref: "#/components/schemas/GalleryDoc" }
        - { $ref: "#/components/schemas/StatisticDoc" }
        - { $ref: "#/components/schemas/AccreditationDoc" }
        - { $ref: "#/components/schemas/PageDoc" }
    SchoolDoc:
      type: object
      additionalProperties: false
      required: [slug, name, short_name, accent_key, summary, description, head_message, sort_order]
      properties:
        slug: { type: string }
        name: { type: string }
        short_name: { type: string }
        accent_key: { type: string, enum: [medical, hospitality, ict, business, pool] }
        summary: { type: string }
        description: { type: string }
        head_message: { type: string }
        sort_order: { type: integer }
    ProgrammeDoc:
      type: object
      additionalProperties: false
      required: [school_id, slug, title, level, mode, duration_months, duration_note, min_kcse_grade, summary, overview, what_you_learn, career_outcomes, assessment_model, seo_title, seo_description, sort_order, requirements, intakes, fees]
      properties:
        school_id: { type: string, format: uuid }
        slug: { type: string }
        title: { type: string }
        level: { type: string, enum: [short_course, artisan, certificate, diploma, higher_diploma] }
        mode: { type: string, enum: [full_time, part_time, blended] }
        duration_months: { type: [integer, "null"] }
        duration_note: { type: string }
        min_kcse_grade: { type: [string, "null"], enum: [A, A-, B+, B, B-, C+, C, C-, D+, D, D-, E, null] }
        summary: { type: string }
        overview: { type: string }
        what_you_learn: { type: string }
        career_outcomes: { type: string }
        assessment_model: { type: string, enum: [marks, competency, both] }
        seo_title: { type: string }
        seo_description: { type: string }
        sort_order: { type: integer }
        requirements:
          type: array
          items:
            type: object
            required: [kind, requirement]
            properties:
              kind: { type: string, enum: [academic, document, other] }
              requirement: { type: string }
        intakes:
          type: array
          items:
            type: object
            required: [id, name, starts_on, applications_open_on, application_deadline, capacity, status]
            properties:
              id: { type: [string, "null"], format: uuid, description: "Null for a new intake; keep it for existing ones." }
              name: { type: string }
              starts_on: { type: string, format: date }
              applications_open_on: { type: [string, "null"], format: date }
              application_deadline: { type: [string, "null"], format: date }
              capacity: { type: [integer, "null"] }
              status: { type: string, enum: [planned, open, closed] }
        fees:
          type: array
          items:
            type: object
            required: [label, category, amount_cents, frequency, notes]
            properties:
              label: { type: string }
              category: { type: string, enum: [tuition, registration, assessment, caution, other] }
              amount_cents: { type: integer, description: "Whole cents of KES: KES 1,000.00 is 100000." }
              frequency: { type: string, enum: [once, per_term, per_year, whole_programme] }
              notes: { type: string }
    NewsDoc:
      type: object
      additionalProperties: false
      required: [slug, title, summary, body, cover_file_id, cover_alt, seo_title, seo_description]
      properties:
        slug: { type: string }
        title: { type: string }
        summary: { type: string }
        body: { type: string }
        cover_file_id: { type: [string, "null"], format: uuid }
        cover_alt: { type: string }
        seo_title: { type: string }
        seo_description: { type: string }
    PageDoc:
      type: object
      additionalProperties: false
      required: [slug, title, summary, body, seo_title, seo_description]
      properties:
        slug: { type: string, description: "The page's address, e.g. privacy for /privacy." }
        title: { type: string }
        summary: { type: string }
        body:
          type: string
          description: 'Plain text. Blank lines separate paragraphs; "## " starts a heading; "- " a list item. Never HTML.'
        seo_title: { type: string }
        seo_description: { type: string }
    EventDoc:
      type: object
      additionalProperties: false
      required: [slug, title, summary, body, location, starts_at, ends_at]
      properties:
        slug: { type: string }
        title: { type: string }
        summary: { type: string }
        body: { type: string }
        location: { type: string }
        starts_at: { type: string, format: date-time }
        ends_at: { type: [string, "null"], format: date-time }
    FaqCategoryDoc:
      type: object
      additionalProperties: false
      required: [slug, name, sort_order]
      properties:
        slug: { type: string }
        name: { type: string }
        sort_order: { type: integer }
    FaqDoc:
      type: object
      additionalProperties: false
      required: [category_id, programme_id, question, answer, sort_order]
      properties:
        category_id: { type: string, format: uuid }
        programme_id: { type: [string, "null"], format: uuid }
        question: { type: string }
        answer: { type: string }
        sort_order: { type: integer }
    BannerDoc:
      type: object
      additionalProperties: false
      required: [message, link_label, link_href, starts_at, ends_at]
      properties:
        message: { type: string, maxLength: 200 }
        link_label: { type: [string, "null"] }
        link_href: { type: [string, "null"] }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
    GalleryDoc:
      type: object
      additionalProperties: false
      required: [file_id, caption, alt_text, consent_confirmed, consent_note, sort_order]
      properties:
        file_id: { type: string, format: uuid }
        caption: { type: string }
        alt_text: { type: string }
        consent_confirmed: { type: boolean, description: "Written consent from everyone recognisable. Required to publish." }
        consent_note: { type: string }
        sort_order: { type: integer }
    StatisticDoc:
      type: object
      additionalProperties: false
      required: [label, value, source_note, verified_on, sort_order]
      properties:
        label: { type: string }
        value: { type: string }
        source_note: { type: string, description: "Where the evidence is. Required to publish." }
        verified_on: { type: [string, "null"], format: date, description: "Required to publish; not in the future." }
        sort_order: { type: integer }
    AccreditationDoc:
      type: object
      additionalProperties: false
      required: [body, reference, description, evidence_note, verified_on, sort_order]
      properties:
        body: { type: string }
        reference: { type: string }
        description: { type: string }
        evidence_note: { type: string, description: "Required to publish." }
        verified_on: { type: [string, "null"], format: date, description: "Required to publish." }
        sort_order: { type: integer }
    Setting:
      type: object
      required: [key, value, description, updated_at]
      properties:
        key: { type: string }
        value: { type: string }
        description: { type: string }
        updated_at: { type: string, format: date-time }
    ImageFile:
      type: object
      required: [id, width, height, url, variants]
      properties:
        id: { type: string, format: uuid }
        width: { type: integer }
        height: { type: integer }
        url: { type: string, description: "Largest stored width." }
        variants:
          type: array
          items:
            type: object
            required: [width, url]
            properties:
              width: { type: integer }
              url: { type: string }
    Session:
      type: object
      required: [user, permissions, csrf_token]
      properties:
        user:
          type: object
          required: [id, email, full_name, kind]
          properties:
            id: { type: string, format: uuid }
            email: { type: string }
            full_name: { type: string }
            kind: { type: string, enum: [staff, student, applicant] }
        permissions: { type: array, items: { type: string } }
        csrf_token: { type: string }
        expires_at: { type: string, format: date-time }
    ApplicantSession:
      allOf:
        - { $ref: "#/components/schemas/Session" }
        - type: object
          required: [application_id, next]
          properties:
            application_id:
              type: [string, "null"]
              format: uuid
              description: Set when the link came from a reference number.
            next: { type: string, description: Path to open after signing in; empty for the account page. }
    MyApplication:
      type: object
      required: [id, reference, status, programme_title, programme_slug, intake_name, intake_starts_on, created_at, updated_at, submitted_at]
      properties:
        id: { type: string, format: uuid }
        reference: { type: string }
        status:
          type: string
          enum: [draft, submitted, under_review, info_requested, offered, offer_accepted, enrolled, rejected, withdrawn, expired]
        programme_title: { type: string }
        programme_slug: { type: string }
        intake_name: { type: [string, "null"] }
        intake_starts_on: { type: [string, "null"], format: date }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        submitted_at: { type: [string, "null"], format: date-time }
    StartedApplication:
      type: object
      required: [id, existing]
      properties:
        id: { type: string, format: uuid }
        existing: { type: boolean }
    ApplicationPersonal:
      type: object
      required: [first_name, middle_name, last_name, date_of_birth, identity_document_type, identity_document, nationality, county, phone]
      properties:
        first_name: { type: string, maxLength: 80 }
        middle_name: { type: string, maxLength: 80 }
        last_name: { type: string, maxLength: 80 }
        date_of_birth: { type: string, description: YYYY-MM-DD, or empty. }
        identity_document_type: { type: string, enum: ["", national_id, passport, birth_certificate] }
        identity_document: { type: string, maxLength: 30 }
        nationality: { type: string, maxLength: 60 }
        county: { type: string, description: One of Kenya's 47 counties, "Outside Kenya", or empty. }
        phone: { type: string }
    ApplicationGuardian:
      type: object
      required: [full_name, relationship, phone, email, consent_given]
      properties:
        full_name: { type: string, maxLength: 120 }
        relationship: { type: string, enum: ["", mother, father, guardian, other_relative, other] }
        phone: { type: string }
        email: { type: string }
        consent_given:
          type: boolean
          description: The parent or guardian named here has read the privacy notice and agrees. Recorded as a consent in their name; changing the name needs it again.
    ApplicationEducation:
      type: object
      required: [level, institution, year_completed, qualification, mean_grade, subjects]
      properties:
        level: { type: string, enum: [kcse, kcpe, certificate, diploma, degree, other] }
        institution: { type: string, maxLength: 120 }
        year_completed: { type: [integer, "null"], minimum: 1950 }
        qualification: { type: string, maxLength: 120 }
        mean_grade: { type: string, description: A KCSE grade (A to E) for KCSE; free text otherwise. }
        subjects:
          type: array
          maxItems: 20
          items:
            type: object
            required: [subject, grade]
            properties:
              subject: { type: string, maxLength: 60 }
              grade: { type: string }
    ApplicationSponsor:
      type: object
      required: [type, name, phone]
      properties:
        type: { type: string, enum: ["", self, parent_guardian, sponsor, other] }
        name: { type: string, maxLength: 120 }
        phone: { type: string }
    FileLink:
      type: object
      required: [url, expires_at]
      properties:
        url: { type: string, description: A path on this site, under /api/v1/files/. }
        expires_at: { type: string, format: date-time }
    ApplicationDocument:
      type: object
      required: [id, kind, name, content_type, size_bytes, scan_status, created_at]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [national_id, birth_certificate, passport, kcse_certificate, other_certificate, passport_photo, other] }
        name: { type: string }
        content_type: { type: string, enum: [application/pdf, image/jpeg, image/png] }
        size_bytes: { type: integer }
        scan_status: { type: string, enum: [not_scanned, clean], description: not_scanned when no virus scanner is configured. }
        created_at: { type: string, format: date-time }
    ApplicationDetail:
      type: object
      required: [id, reference, status, editable, programme_title, programme_slug, intake_id, intake_name, intake_starts_on,
        open_intakes, email, personal, needs_guardian, guardian, education, sponsor, documents, required_documents,
        missing, history, can_upload, can_withdraw, info_request, offer, draft_expires_at, created_at, updated_at, submitted_at]
      properties:
        id: { type: string, format: uuid }
        reference: { type: string }
        status: { $ref: "#/components/schemas/MyApplication/properties/status" }
        editable: { type: boolean }
        programme_title: { type: string }
        programme_slug: { type: string }
        intake_id: { type: [string, "null"], format: uuid }
        intake_name: { type: [string, "null"] }
        intake_starts_on: { type: [string, "null"], format: date }
        open_intakes:
          type: array
          items:
            type: object
            required: [id, name, starts_on, application_deadline]
            properties:
              id: { type: string, format: uuid }
              name: { type: string }
              starts_on: { type: string, format: date }
              application_deadline: { type: [string, "null"], format: date }
        email: { type: string }
        personal: { $ref: "#/components/schemas/ApplicationPersonal" }
        needs_guardian: { type: boolean, description: True when the date of birth makes the applicant under 18 today. }
        guardian: { $ref: "#/components/schemas/ApplicationGuardian" }
        education: { type: array, items: { $ref: "#/components/schemas/ApplicationEducation" } }
        sponsor: { $ref: "#/components/schemas/ApplicationSponsor" }
        missing:
          type: array
          description: What is still needed before submission, by step.
          items:
            type: object
            required: [step, field, message]
            properties:
              step: { type: string, enum: [choice, personal, guardian, education, sponsor, documents] }
              field: { type: string }
              message: { type: string }
        documents: { type: array, items: { $ref: "#/components/schemas/ApplicationDocument" } }
        required_documents:
          type: array
          description: Document kinds this application needs before it can be submitted.
          items: { $ref: "#/components/schemas/ApplicationDocument/properties/kind" }
        history:
          type: array
          description: Status changes, oldest first.
          items:
            type: object
            required: [status, reason, at]
            properties:
              status: { $ref: "#/components/schemas/MyApplication/properties/status" }
              reason: { type: string }
              at: { type: string, format: date-time }
        can_upload: { type: boolean, description: Documents can be added (a draft, or while more information is requested). }
        can_withdraw: { type: boolean }
        info_request:
          type: [object, "null"]
          description: What the admissions office is waiting for (status info_requested).
          required: [message, requested_at]
          properties:
            message: { type: string }
            requested_at: { type: string, format: date-time }
        offer:
          type: [object, "null"]
          required: [issued_at, respond_by, conditions, accepted_at, declined_at, has_letter]
          properties:
            issued_at: { type: string, format: date-time }
            respond_by: { type: string, format: date }
            conditions: { type: string }
            accepted_at: { type: [string, "null"], format: date-time }
            declined_at: { type: [string, "null"], format: date-time }
            has_letter: { type: boolean }
        draft_expires_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        submitted_at: { type: [string, "null"], format: date-time }
    ApplicationSnapshot:
      type: object
      description: The application exactly as submitted (D-114).
      required: [reference, submitted_at, programme_title, programme_slug, intake_id, intake_name, intake_starts_on, email, personal, guardian, education, sponsor, documents]
      properties:
        reference: { type: string }
        submitted_at: { type: string, format: date-time }
        programme_title: { type: string }
        programme_slug: { type: string }
        intake_id: { type: [string, "null"], format: uuid }
        intake_name: { type: [string, "null"] }
        intake_starts_on: { type: [string, "null"], format: date }
        email: { type: string }
        personal: { $ref: "#/components/schemas/ApplicationPersonal" }
        guardian:
          oneOf:
            - { $ref: "#/components/schemas/ApplicationGuardian" }
            - { type: "null" }
          description: Only for applicants under 18.
        education: { type: array, items: { $ref: "#/components/schemas/ApplicationEducation" } }
        sponsor: { $ref: "#/components/schemas/ApplicationSponsor" }
        documents: { type: array, items: { $ref: "#/components/schemas/ApplicationDocument" } }
    StaffApplicationItem:
      type: object
      required: [id, reference, status, applicant_name, email, programme_title, intake_name, intake_starts_on, assigned_to, assignee_name, respond_by, submitted_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        reference: { type: string }
        status: { $ref: "#/components/schemas/MyApplication/properties/status" }
        applicant_name: { type: string }
        email: { type: string }
        programme_title: { type: string }
        intake_name: { type: [string, "null"] }
        intake_starts_on: { type: [string, "null"], format: date }
        assigned_to: { type: [string, "null"], format: uuid }
        assignee_name: { type: [string, "null"] }
        respond_by: { type: [string, "null"], format: date, description: Set while an offer is open. }
        submitted_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    StaffApplicationPage:
      type: object
      required: [items, page, total_pages, total]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/StaffApplicationItem" } }
        page: { type: integer }
        total_pages: { type: integer }
        total: { type: integer }
    StaffApplicationDetail:
      type: object
      required: [id, reference, status, programme_id, programme_title, intake_id, intake_name, intake_starts_on, applicant, assigned_to, assignee_name,
        submitted_at, decided_at, updated_at, submitted, documents, history, notes, info_requests, offer, student, actions]
      properties:
        id: { type: string, format: uuid }
        reference: { type: string }
        status: { $ref: "#/components/schemas/MyApplication/properties/status" }
        programme_id: { type: string, format: uuid }
        programme_title: { type: string }
        intake_id: { type: [string, "null"], format: uuid }
        intake_name: { type: [string, "null"] }
        intake_starts_on: { type: [string, "null"], format: date }
        applicant:
          type: object
          required: [name, email, phone]
          properties:
            name: { type: string }
            email: { type: string }
            phone: { type: [string, "null"] }
        assigned_to: { type: [string, "null"], format: uuid }
        assignee_name: { type: [string, "null"] }
        submitted_at: { type: string, format: date-time }
        decided_at: { type: [string, "null"], format: date-time }
        updated_at: { type: string, format: date-time }
        submitted:
          oneOf:
            - { $ref: "#/components/schemas/ApplicationSnapshot" }
            - { type: "null" }
        documents:
          type: array
          items:
            allOf:
              - { $ref: "#/components/schemas/ApplicationDocument" }
              - type: object
                required: [after_submission]
                properties:
                  after_submission: { type: boolean, description: Sent later, in reply to a request for information. }
        history:
          type: array
          description: Every status change, oldest first, with who made it (null for the applicant or the system).
          items:
            type: object
            required: [from, to, reason, at, changed_by_name]
            properties:
              from: { type: [string, "null"] }
              to: { $ref: "#/components/schemas/MyApplication/properties/status" }
              reason: { type: string }
              at: { type: string, format: date-time }
              changed_by_name: { type: [string, "null"] }
        notes:
          type: array
          items:
            type: object
            required: [id, body, author_name, created_at]
            properties:
              id: { type: string, format: uuid }
              body: { type: string }
              author_name: { type: string }
              created_at: { type: string, format: date-time }
        info_requests:
          type: array
          items:
            type: object
            required: [id, message, requested_at, requested_by_name, response, closed_at, closed_by_name]
            properties:
              id: { type: string, format: uuid }
              message: { type: string }
              requested_at: { type: string, format: date-time }
              requested_by_name: { type: string }
              response: { type: string, description: The applicant's reply; empty if staff closed it. }
              closed_at: { type: [string, "null"], format: date-time }
              closed_by_name: { type: [string, "null"], description: Set when staff closed it without a reply. }
        offer:
          type: [object, "null"]
          required: [issued_at, issued_by_name, respond_by, conditions, accepted_at, declined_at, has_letter]
          properties:
            issued_at: { type: string, format: date-time }
            issued_by_name: { type: string }
            respond_by: { type: string, format: date }
            conditions: { type: string }
            accepted_at: { type: [string, "null"], format: date-time }
            declined_at: { type: [string, "null"], format: date-time }
            has_letter: { type: boolean }
        student:
          type: [object, "null"]
          required: [id, student_number, status, enrolled_at, invoice_id, invoice_status]
          properties:
            id: { type: string, format: uuid }
            student_number: { type: string }
            status: { type: string, enum: [active, deferred, suspended, withdrawn, graduated] }
            enrolled_at: { type: string, format: date-time }
            invoice_id: { type: string, format: uuid }
            invoice_status: { type: string, enum: [draft, issued, void] }
        actions:
          type: array
          items: { type: string, enum: [assign, note, request_info, resume_review, offer, reject, enrol] }
    AdmissionsFigures:
      type: object
      required: [submitted, in_review, info_requested, offered, accepted, enrolled, rejected, withdrawn, expired]
      properties:
        submitted: { type: integer }
        in_review: { type: integer, description: Submitted, under review or waiting on the applicant now. }
        info_requested: { type: integer }
        offered: { type: integer, description: Every application that received an offer, whatever happened next. }
        accepted: { type: integer, description: Accepted, including those since enrolled. }
        enrolled: { type: integer }
        rejected: { type: integer }
        withdrawn: { type: integer }
        expired: { type: integer }
    AdmissionsReport:
      type: object
      required: [from, to, rows, totals]
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        rows:
          type: array
          items:
            allOf:
              - type: object
                required: [programme_id, programme_title, intake_id, intake_name]
                properties:
                  programme_id: { type: string, format: uuid }
                  programme_title: { type: string }
                  intake_id: { type: [string, "null"], format: uuid }
                  intake_name: { type: [string, "null"] }
              - { $ref: "#/components/schemas/AdmissionsFigures" }
        totals: { $ref: "#/components/schemas/AdmissionsFigures" }
    Person:
      type: object
      required: [id, full_name]
      properties:
        id: { type: string, format: uuid }
        full_name: { type: string }
    School:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
    StudentStatus: { type: string, enum: [active, deferred, suspended, withdrawn, graduated] }
    StudentItem:
      type: object
      required: [id, student_number, name, email, status, programme_title, cohort_name, enrolled_at]
      properties:
        id: { type: string, format: uuid }
        student_number: { type: string }
        name: { type: string }
