    post:
      tags: [applicant]
      operationId: startApplication
      summary: Start an application for a programme and intake
      description: |
        The programme must be published and the intake open (with one open intake it may be left
        out). Gives the draft a reference number (DTC-APP-YYYY-NNNNNN) and emails it. Starting
        the same programme and intake again answers 200 with the existing application.
        409 applications_closed when no intake is open.
      security: [{ session: [], csrf: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [programme]
              properties:
                programme: { type: string, description: Programme slug. }
                intake_id: { type: [string, "null"], format: uuid }
      responses:
        "200":
          description: An application for this programme and intake already existed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StartedApplication" }
        "201":
          description: Started.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StartedApplication" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
