        required: true
        content:
          application/json:
            schema: { type: object, required: [note], properties: { note: { type: string, minLength: 5, maxLength: 1000 } } }
      responses:
        "204": { description: Marked. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
