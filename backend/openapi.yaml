        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/staff/finance/kcb/reconciliation:
    get:
      tags: [kcb]
      operationId: kcbReconciliation
      summary: One day's KCB notifications, to compare with the KCB statement (finance.view)
      parameters:
        - { name: day, in: query, required: true, schema: { type: string, format: date } }
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KcbReconciliation" }
