        paid_cents: { $ref: "#/components/schemas/Cents" }
        credits_cents: { $ref: "#/components/schemas/Cents" }
        pending_cents: { $ref: "#/components/schemas/Cents" }
        overdue_cents: { $ref: "#/components/schemas/Cents" }
