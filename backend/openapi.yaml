        registration_closes_on: { type: string, description: YYYY-MM-DD or empty. }
    Unit:
      type: object
      required: [id, school_id, school_name, code, title, description, hours, active, is_sample]
      properties:
        id: { type: string, format: uuid }
        school_id: { type: string, format: uuid }
        school_name: { type: string }
        code: { type: string }
        title: { type: string }
        description: { type: string }
        hours: { type: [integer, "null"] }
        active: { type: boolean }
        is_sample: { type: boolean }
    UnitInput:
      type: object
      required: [code, title]
      properties:
        school_id: { type: string, format: uuid, description: Required when creating; ignored when editing. }
        code: { type: string, description: "2 to 20 capitals, digits, spaces, slashes or dashes, like ICT 101." }
        title: { type: string, maxLength: 160 }
        description: { type: string, maxLength: 2000 }
        hours: { type: [integer, "null"], minimum: 1, maximum: 2000 }
        active: { type: boolean }
    ProgrammeUnit:
      type: object
      required: [unit_id, code, title, hours, stage, is_core]
      properties:
        unit_id: { type: string, format: uuid }
        code: { type: string }
        title: { type: string }
        hours: { type: [integer, "null"] }
        stage: { type: integer }
        is_core: { type: boolean }
    OfferingItem:
      type: object
      required: [id, term_id, term_name, unit_id, unit_code, unit_title, trainer_names, registered]
      properties:
        id: { type: string, format: uuid }
        term_id: { type: string, format: uuid }
        term_name: { type: string }
        unit_id: { type: string, format: uuid }
        unit_code: { type: string }
        unit_title: { type: string }
        trainer_names: { type: string }
        registered: { type: integer }
    TimetableEntry:
      type: object
