    post:
      tags: [mpesa]
      operationId: mpesaValidation
      summary: Safaricom's C2B validation call (public; answered only on the secret path)
      description: Stored as received and always accepted; a payment that matches no student waits for Finance (D-171). 404 for any other secret or address.
      security: []
      parameters:
        - { name: secret, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "200":
          description: Accepted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MpesaAnswer" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/payments/c2b/{secret}/confirmation:
    post:
      tags: [mpesa]
      operationId: mpesaConfirmation
      summary: Safaricom's C2B confirmation of a completed payment (public; answered only on the secret path)
      description: |
        Stored as received, then recorded once per M-Pesa code. For the college shortcode with a
        student's number as the account number, the payment is confirmed and receipted (AC-11);
        otherwise it waits for Finance. 404 for any other secret or address.
      security: []
      parameters:
        - { name: secret, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "200":
          description: Received.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MpesaAnswer" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
