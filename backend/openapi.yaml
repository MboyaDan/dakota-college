          properties:
            narration: { type: string }
            verified: { type: boolean }
            payment_status: { type: [string, "null"], enum: [pending, confirmed, rejected, null] }
    KcbReconciliation:
      type: object
      required: [day, lines, received_count, received_cents, credited_cents, unmatched_cents]
      properties:
        day: { type: string, format: date }
        lines:
          type: array
          items:
            type: object
            required: [status, count, total_cents]
            properties:
              status: { type: string }
              count: { type: integer }
              total_cents: { $ref: "#/components/schemas/Cents" }
        received_count: { type: integer }
        received_cents: { $ref: "#/components/schemas/Cents" }
        credited_cents: { $ref: "#/components/schemas/Cents" }
        unmatched_cents: { $ref: "#/components/schemas/Cents" }
    Error:
      description: Error body returned by every endpoint on failure.
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Stable machine-readable code, e.g. not_found.
            message:
              type: string
              description: Plain-language message safe to show to users.
            request_id:
              type: string
            fields:
              type: array
              description: For validation_failed, what to fix in each field.
              items:
                type: object
                required: [field, message]
                properties:
                  field: { type: string }
                  message: { type: string }
