      parameters:
        - { name: status, in: query, schema: { type: string, enum: [pending, confirmed, rejected] } }
        - { name: method, in: query, schema: { type: string, enum: [cash, bank, mpesa, sponsor] } }
        - { name: q, in: query, description: Reference, receipt number, student number or name., schema: { type: string } }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema: { type: object, required: [items, total, page_size], properties: { items: { type: array, items: { $ref: "#/components/schemas/Payment" } }, total: { type: integer }, page_size: { type: integer } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
    post:
      tags: [finance]
      operationId: recordPayment
      summary: Record money received (finance.payment.record)
      description: |
        Bank, M-Pesa and sponsor payments are pending until confirmed and do not count (AC-11).
        Cash recorded by someone who also holds finance.payment.confirm is confirmed and receipted
        at once. A retry with the same Idempotency-Key gets the first answer (header
        Idempotent-Replayed); the same key with other details answers 422 idempotency_key_reused.
      security: [{ session: [], csrf: [] }]
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PaymentInput" }
      responses:
        "200":
          description: Recorded, or the stored answer to a retry.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Payment" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
