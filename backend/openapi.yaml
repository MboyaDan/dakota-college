              schema: { $ref: "#/components/schemas/Invoice" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/staff/finance/students/{id}/adjustments:
    post:
      tags: [finance]
      operationId: adjustAccount
      summary: Record a compensating charge or credit with a reason (finance.adjust)
      description: Never edits what it corrects; it may point at the issued invoice or confirmed payment it corrects. Takes an Idempotency-Key.
      security: [{ session: [], csrf: [] }]
      parameters:
        - { $ref: "#/components/parameters/ID" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, amount_cents, reason]
              properties:
                kind: { type: string, enum: [charge, credit] }
                amount_cents: { type: integer, format: int64, minimum: 1 }
                reason: { type: string, minLength: 5, maxLength: 1000 }
                invoice_id: { type: [string, "null"], format: uuid }
                payment_id: { type: [string, "null"], format: uuid }
      responses:
        "200":
          description: Recorded, or the stored answer to a retry.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Adjustment" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/student/fees:
