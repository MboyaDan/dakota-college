name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Go + PostgreSQL)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_USER: dakota
          POSTGRES_PASSWORD: dakota_ci_only
          POSTGRES_DB: dakota_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dakota -d dakota_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://dakota:dakota_ci_only@localhost:5432/dakota_test?sslmode=disable
      # Database tests fail instead of skipping if the database is missing.
      REQUIRE_DB_TESTS: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          cache-dependency-path: backend/go.sum
      - uses: sqlc-dev/setup-sqlc@v5
        with:
          sqlc-version: "1.31.1"
      - name: sqlc code is up to date
        run: |
          sqlc generate
          git diff --exit-code -- internal/db/dbq || { echo "Run 'make sqlc' and commit internal/db/dbq"; exit 1; }
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "gofmt needed:"; echo "$out"; exit 1; fi
      - run: go vet ./...
      - run: go test -race ./...
      - name: Build API image
        run: docker build -t dakota-api:ci .

  frontend:
    name: Frontend (lint, types, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - name: OpenAPI types are up to date
        run: |
          npm run gen:api
          git diff --exit-code -- lib/api/schema.d.ts || { echo "Run 'npm run gen:api' and commit lib/api/schema.d.ts"; exit 1; }
      - run: npm run typecheck
      - run: npm test
      - name: Build (with the dev-only /design page so axe can check every component)
        run: npm run build
        env:
          ENABLE_DESIGN_PAGE: "1"
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
